<style>

    --silver:#9EA2A7; --silver-soft:#f2f3f4; --silver-line:#dfe1e4;

  }

  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink)}
  h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:.02em;color:var(--ink)}

  .panel{width:100%;max-width:440px;background:var(--card);border:1px solid var(--silver-line);border-radius:16px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.02)}

  .panel label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}

  .panel button:hover{background:var(--gold-deep);box-shadow:0 4px 14px rgba(221,166,64,.35)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
function escAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escJs(s){ return String(s==null?'':s).replace(/'/g,"\\'"); }

/* ---- Widget reutilizable: filtro de selección múltiple (mismo patrón que derivaciones_incamotors.html) ---- */
function normalizarOpcionesMS(opciones){
  return opciones.map(o => (o && typeof o==='object') ? o : {value:o, label:o});
}
function resumenMultiSelect(opcionesNorm, seleccionados){
  if(seleccionados.length===0 || seleccionados.length===opcionesNorm.length) return 'Todos';
  const labelDe = v => { const f = opcionesNorm.find(o=>o.value===v); return f ? f.label : v; };
  if(seleccionados.length===1) return labelDe(seleccionados[0]);
  return `${labelDe(seleccionados[0])} (+${seleccionados.length-1})`;
}
function renderMultiSelect(containerId, opciones, seleccionados, onChange){
  const el = document.getElementById(containerId);
  if(!el) return;
  const norm = normalizarOpcionesMS(opciones);
  el.innerHTML = `<div class="ms-wrap">
      <button type="button" class="ms-btn" onclick="toggleMultiSelect('${containerId}')"><span class="ms-resumen" id="${containerId}-resumen">${resumenMultiSelect(norm, seleccionados)}</span><span class="ms-caret">&#9662;</span></button>
      <div class="ms-panel" id="${containerId}-panel">
        ${norm.length ? `<div class="ms-panel-actions">
          <button type="button" onclick="msSeleccionarTodos('${containerId}')">Todos</button>
          <button type="button" onclick="msLimpiar('${containerId}')">Ninguno</button>
        </div>
        <div class="ms-items">${norm.map(o=>`<label class="ms-item"><input type="checkbox" value="${escAttr(o.value)}" ${seleccionados.includes(o.value)?'checked':''}> ${o.label}</label>`).join('')}</div>`
        : '<p class="ms-empty">Sin opciones</p>'}
      </div>
    </div>`;
  el._msOpciones = norm;
  el._msOnChange = onChange;
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.onchange = ()=>msOnCheckChange(containerId); });
}
function msOnCheckChange(containerId){
  const el = document.getElementById(containerId);
  const checked = [...el.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
  const resumenEl = document.getElementById(containerId+'-resumen');
  if(resumenEl) resumenEl.textContent = resumenMultiSelect(el._msOpciones, checked);
  el._msOnChange(checked);
}
function msSeleccionarTodos(containerId){
  const el = document.getElementById(containerId);
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=true);
  msOnCheckChange(containerId);
}
function msLimpiar(containerId){
  const el = document.getElementById(containerId);
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
  msOnCheckChange(containerId);
}
function toggleMultiSelect(containerId){
  const panel = document.getElementById(containerId+'-panel');
  if(!panel) return;
  const abrir = !panel.classList.contains('open');
  document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));
  if(abrir) panel.classList.add('open');
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));
  }
});
function msFiltraArray(seleccionados, valor){
  return seleccionados.length===0 || seleccionados.includes(valor);
}

/* ---- Estado global (todo vive en la Google Sheet vía gsCall_, sin carpeta local) ---- */
let maestro=null;
let catalogo=null;       // { articulos: {...} }
let cotizaciones=null;   // { registros: {...} }
let solicitudesArticulo={}; // { [codigo_temporal]: {...} } — solicitudes de código nuevo pendientes/resueltas
let currentUser=null;
/* ---- Backend: Supabase (reemplaza a Apps Script/Código.gs — ver migracion_datos.sql y
   rls_policies_acc.sql para el esquema completo). Autenticación real vía Supabase Auth: cada
   "codigo" de usuario (ej. "aqp1") se mapea a un email interno sintético (ej. "aqp1@acc.interno")
   solo para el login por dentro — la pantalla sigue pidiendo "usuario", nunca un email. ---- */
const SUPABASE_URL = 'https://anqfqtitmzxofeoirjpa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_JUEKagL2kmhdTV1-2y9reg_bGiRUjCs';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
function emailInternoDeCodigo_(codigo){ return String(codigo).trim().toLowerCase()+'@acc.interno'; }

/* ---- Sincronización con Sistema PYB (Maryana): cada cotización guardada en ACC se copia también
   como una cotización propia en la Sheet de Maryana (acción 'crearCotizacion' de su Código.gs), para
   que su equipo la siga desde su propio sistema. Es una copia de un solo sentido (ACC -> Maryana) y
   de "mejor esfuerzo": si falla, la cotización de ACC ya quedó guardada igual — no se bloquea ni se
   revierte nada, solo se avisa. ---- */
/* ⚠️ La URL y las CREDENCIALES de Maryana ya NO viven acá. Estaban hardcodeadas en este archivo, que
   se descarga entero a cada navegador: cualquier vendedor que abriera la app —o cualquiera que
   guardara la página— podía leer usuario y contraseña de OTRO sistema. Ahora las llamadas pasan por la

async function llamarMaryana_(accion, payload){
  const d = await llamarEdgeFunction_('maryana-proxy', { accion, payload: payload||{} });
  return d; // { maryana: <respuesta cruda de Maryana>, actorUsuario }

// Maryana solo tiene stock/usuarios en estas 4 sedes — Piura y Trujillo no tienen equivalente ahí,
// así que sus cotizaciones se guardan normal en ACC pero no se copian (decisión explícita del usuario).
const SEDE_MARYANA_POR_ACC = { AQP:'Arequipa', CUS:'Cusco', ICA:'Ica', JUL:'Juliaca' };
/* Maryana no maneja el concepto de "Kit" — para ella cada línea es un producto suelto de su propio
   inventario. Por eso un ítem de Kit se desglosa en una línea por cada componente (componentes_snapshot,
   la "receta" congelada del kit al momento de cotizar), en vez de mandar el Kit como una sola línea.
   El precio del Kit (que suele traer descuento y no es la simple suma de sus componentes) se reparte
   entre los componentes a prorrata de su precio de catálogo en esa sede/moneda — así el total que ve
   Maryana sigue cuadrando con el total real de la cotización, componente por componente. Si un
   componente ya no tiene precio en catálogo (fue borrado o descontinuado luego de armar el kit), se le
   asigna peso neutro (como si costara 1) en vez de excluirlo, para no perder esa unidad del reparto. */
function desglosarItemParaMaryana_(it, sede, moneda){
  if(!it.es_kit || !(it.componentes_snapshot||[]).length){
    return [{ descripcion: it.nombre_largo||it.nombre_corto||it.codigo_articulo, cantidad: it.cantidad, precioUnitarioNativo: it.precio_unitario, codigoArticulo: it.codigo_articulo }];
  }
  const pesos = it.componentes_snapshot.map(comp=>{
    const art = catalogo.articulos[comp.codigo_articulo];
    const pSede = art && art.precios_por_sede && art.precios_por_sede[sede];
    const precioCatalogo = pSede ? (moneda==='USD' ? pSede.precio_venta_usd : pSede.precio_venta_pen) : null;
    const cantidadTotal = comp.cantidad * it.cantidad;
    return { comp, cantidadTotal, peso: (precioCatalogo!=null ? precioCatalogo : 1) * cantidadTotal };
  });
  const sumaPesos = pesos.reduce((s,p)=>s+p.peso,0) || 1;
  return pesos.filter(p=>p.cantidadTotal>0).map(({comp,cantidadTotal,peso})=>({
    descripcion: comp.nombre_largo||comp.nombre_corto||comp.codigo_articulo,
    cantidad: cantidadTotal,
    precioUnitarioNativo: Math.round((it.subtotal * (peso/sumaPesos) / cantidadTotal) * 100) / 100,
    codigoArticulo: comp.codigo_articulo
  }));
}
/* Código de proveedor: el que se carga por artículo en Mantenimientos -> Artículos (proveedores[].
   codigos_externos), NO el código interno de ACC (ACC-00001) ni el SAP (92-ACC-00001) — es el único que
   tiene sentido que coincida con el catálogo de Maryana, porque es el código real del producto físico
   (el que trae la factura del proveedor), no un id interno de cada sistema. Si el artículo tiene varios
   proveedores/códigos cargados, se usa el primero no vacío que se encuentre. */
function codigoProveedorDeArticulo_(codigoArticulo){
  const art = catalogo.articulos[codigoArticulo];
  if(!art) return null;
  for(const p of (art.proveedores||[])){
    for(const ce of (p.codigos_externos||[])){
      if(ce && String(ce).trim()) return String(ce).trim();
    }
  }
  return null;
}
/* 'estado' es la única acción de lectura del backend de Maryana y devuelve TODO su sistema (productos,
   stock, movimientos, cotizaciones, OS, solicitudes...) — pesada, medida en vivo entre 6 y 40 segundos
   según la carga del momento (no es un caso raro, es su comportamiento normal actual). Por eso el límite
   es 45s, no unos pocos segundos: con un límite corto esta consulta casi nunca alcanza a terminar y el
   cruce de código nunca se aplica. El cruce sigue siendo una mejora, no algo de lo que dependa poder
   copiar la cotización: si de todos modos falla o se pasa de 45s, se sigue sin el cruce (todo
   esNuevo:true, como antes de esa mejora) en vez de abortar toda la sincronización por esto. */
async function obtenerProductosMaryana_(){
  // El timeout de 45s ahora vive dentro de `maryana-proxy` (Maryana tarda entre 6 y 40s en responder
  // esta acción). Sigue siendo best-effort: si falla, se devuelve [] y el cruce de códigos se omite,
  // igual que antes — nunca debe impedir que la cotización se copie.
  try{
    const { maryana } = await llamarMaryana_('estado');
    return (maryana && maryana.ok && maryana.data.productos) || [];
  }catch(e){
    return [];
  }
}
async function sincronizarCotizacionConMaryana_(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  const sedeMaryana = SEDE_MARYANA_POR_ACC[c.sede];
  if(!sedeMaryana) return; // Piura/Trujillo: no hay dónde copiarla en Maryana, se omite en silencio
  const tipoCambio = c.moneda==='USD' ? tcGlobalDolaresASoles() : 0;
  const aSoles = (precio)=> c.moneda==='USD' ? Math.round(precio*tipoCambio*100)/100 : precio;
  // Consulta el catálogo vivo de Maryana ANTES de armar el payload: solo se manda codigo+esNuevo:false
  // cuando el código de proveedor de ACC ya existe tal cual en su Productos — si no existe (o el
  // artículo no tiene código de proveedor cargado), la línea viaja como esNuevo:true, igual que antes.
  // Cuando SÍ hay match, la descripción también se reemplaza por la de Maryana (su nombre de catálogo
  // manda sobre el de ACC), para que la línea quede consistente con el producto que ya tienen registrado.
  const productosMaryana = await obtenerProductosMaryana_();
  const productosMaryanaPorCodigo = new Map(productosMaryana.map(p=>[String(p.codigo), p]));
  const body = {
    sede: sedeMaryana,
    cliente: c.cliente.nombre,
    correo: c.cliente.email||'',
    dni: c.cliente.documento||'',
    telefono: c.cliente.telefono||'',
    modelo: c.vehiculo.modelo||'',
    asesor: c.vendedor.nombre,
    placaVin: c.vehiculo.vin||'',
    tipoCambio,
    items: c.items.flatMap(it=>desglosarItemParaMaryana_(it, c.sede, c.moneda)).map(linea=>{
      const codigoProveedor = linea.codigoArticulo ? codigoProveedorDeArticulo_(linea.codigoArticulo) : null;
      const productoMaryana = codigoProveedor ? productosMaryanaPorCodigo.get(codigoProveedor) : null;
      return {
        descripcion: productoMaryana ? productoMaryana.descripcion : linea.descripcion,
        cantidad: linea.cantidad,
        precioUnitario: aSoles(linea.precioUnitarioNativo),
        codigo: productoMaryana ? codigoProveedor : '',
        esNuevo: !productoMaryana
      };
    })
  };
  const { maryana: json, actorUsuario } = await llamarMaryana_('crearCotizacion', body);
  if(!json || !json.ok) throw new Error((json && json.error) || 'Error de conexión con Maryana.');
  // 'crearCotizacion' devuelve el estado COMPLETO de Maryana (incluye la fila recién creada, porque lee
  // la Sheet después de escribirla) — se aprovecha esa misma respuesta para identificar el id de la
  // fila propia (sin otra consulta) y guardarlo en la cotización de ACC. Ese id es lo que permite, más
  // adelante, cambiar el estado de ESA fila puntual en Maryana (ver aprobarCotizacionEnMaryana_).
  try{
    const totalEnviado = body.items.reduce((s,it)=>s+it.cantidad*it.precioUnitario, 0);
    const candidatos = (json.data.cotizaciones||[]).filter(x=>
      x.creadoPor===actorUsuario && x.cliente===body.cliente &&
      String(x.dni||'')===String(body.dni||'') && Math.abs(Number(x.total)-totalEnviado)<0.5
    );
    if(candidatos.length){
      candidatos.sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
      c.maryana_cotizacion_id = candidatos[0].id;
      await guardarCotizacionEnArchivo(codigo);
    }
  }catch(e){ /* no se pudo identificar la fila propia — la copia ya se hizo bien, solo no se podrá
                cambiar su estado más adelante desde ACC */ }
}
/* Se dispara desde "Pasar a facturar" (ver pasarAFacturar) — refleja en Maryana que la cotización ya
   avanzó en ACC. Si Maryana ya la movió más allá de Borrador por su cuenta (su equipo suele actuar muy
   rápido sobre cada fila nueva), no hay nada que aprobar — se ignora en silencio, no es un error real. */
async function aprobarCotizacionEnMaryana_(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c || !c.maryana_cotizacion_id) return; // nunca se sincronizó, o no se pudo identificar su fila en Maryana
  const { maryana: json } = await llamarMaryana_('aprobarCotizacion', { cotizacionId: c.maryana_cotizacion_id });
  if(!json || !json.ok){
    if(/solo se puede aprobar/i.test((json && json.error)||'')) return;
    throw new Error((json && json.error) || 'Error de conexión con Maryana.');
  }
}

/* ---- UI optimista: notificación persistente de error (no se autooculta, el usuario la cierra) ---- */
function mostrarNotificacionError_(mensaje){
  const stack = document.getElementById('notif-stack');
  if(!stack){ alert(mensaje); return; }
  const el = document.createElement('div');
  el.className = 'notif-error';
  el.innerHTML = `<span></span><span class="notif-close" title="Cerrar">✕</span>`;
  el.querySelector('span').textContent = '⚠ ' + mensaje;
  el.querySelector('.notif-close').onclick = ()=> el.remove();
  stack.appendChild(el);
  while(stack.children.length > 5) stack.removeChild(stack.firstChild);
}
/* ---- UI optimista: guardado real en segundo plano, con reintentos ----
   El cambio ya se aplicó en memoria y en pantalla antes de llamar a esto — esta función solo se
   encarga de que la escritura real llegue al servidor, sin bloquear al usuario. Reintenta hasta
   REINTENTOS_GUARDADO_BG veces (con espera creciente) ante CUALQUIER falla — es seguro porque los
   guardados que la usan son upserts idempotentes (mismo código = misma fila, nunca duplica). Si se
   agotan los reintentos, se avisa con una notificación persistente en vez de perder el cambio en
   silencio. NO usar esto para acciones no-idempotentes (ej. crear una cotización en Maryana — ver
   sincronizarCotizacionConMaryana_, que crea una fila nueva cada vez y por eso se deja como intento
   único con su propio manejo de error). */
const REINTENTOS_GUARDADO_BG = 5;
function guardarEnSegundoPlano_(descripcion, fnGuardar){
  (async ()=>{
    let ultimoError;
    for(let intento=1; intento<=REINTENTOS_GUARDADO_BG; intento++){
      try{ await fnGuardar(); mostrarGuardado_(); return; }
      catch(e){
        ultimoError = e;
        if(intento < REINTENTOS_GUARDADO_BG) await new Promise(r=>setTimeout(r, 1200*intento));
      }
    }
    mostrarNotificacionError_(`No se pudo guardar "${descripcion}" tras ${REINTENTOS_GUARDADO_BG} intentos. ${ultimoError&&ultimoError.message||'Error de conexión.'} Revisa tu conexión e inténtalo de nuevo.`);
  })();
}
function esErrorConexionTransitorio_(e){
  return /Unexpected token|JSON|Failed to fetch|NetworkError|Load failed/i.test((e&&e.message)||'');
}

function migrarMaestro(m){
  if(!m.empresa_por_sede){
    m.empresa_por_sede = {};
    const base = m.empresa || { razon_social:'AUTOMOTRIZ INCAMOTORS S.A.C.', ruc:'20455307954', direccion:'', telefono:'', email:'' };
    (m.sedes||[]).forEach(s=>{ m.empresa_por_sede[s] = { ...base }; });
    delete m.empresa;
  }
  (m.sedes||[]).forEach(s=>{ if(!m.empresa_por_sede[s]) m.empresa_por_sede[s] = { razon_social:'AUTOMOTRIZ INCAMOTORS S.A.C.', ruc:'20455307954', direccion:'', telefono:'', email:'' }; });
  if(!m.terminos_condiciones) m.terminos_condiciones='Todos los precios incluyen IGV.\nTodos los productos incluyen instalación.\nTodos los productos tienen 1 año de garantía.\nEl pago de servicios es a cuenta de INCAMOTORS.';
  if(!m.tipo_cambio) m.tipo_cambio=3.35;
  if(!m.tipo_cambio_dolares_a_soles) m.tipo_cambio_dolares_a_soles=m.tipo_cambio;
  if(!m.marcas_producto) m.marcas_producto=[];
  // Punto 7: tramos de descuento por monto de venta. Editables en Mantenimientos — se siembran con los
  // dos que definió el usuario, pero la lista es un catálogo más (se pueden agregar/quitar umbrales).
  if(!Array.isArray(m.tramos_descuento) || !m.tramos_descuento.length){
    m.tramos_descuento = [{desde:1500, pctMax:5},{desde:5000, pctMax:10}];
  }
  // % del descuento que asume cada proveedor (el resto lo asume Incamotors). Vive dentro del propio
  // objeto de proveedor, que ya es una lista jsonb — no necesitó tabla ni columna nueva.
  (m.proveedores||[]).forEach(p=>{ if(p.pct_asume_descuento===undefined || p.pct_asume_descuento===null) p.pct_asume_descuento = 0; });
  // Traducción de la sede del DMS al formato de ACC + interruptor de qué sede se sincroniza.
  // ⚠️ La traducción va SIEMPRE del DMS hacia ACC, nunca al revés: renombrar las sedes de ACC para
  // parecerse al DMS arrastraría migraciones de todo lo que ya usa 'AQP'/'CUS'/... (cotizaciones,
  // artículos, metas, precios por sede). Vive en configuración y no en el código para que una sede
  // nueva del DMS se resuelva desde la interfaz, sin tocar código ni volver a desplegar.
  if(!Array.isArray(m.sedes_dms) || !m.sedes_dms.length){
    m.sedes_dms = [
      { dms:'AREQUIPA', sede:'AQP', sincronizar:true  },
      { dms:'CUSCO',    sede:'CUS', sincronizar:true  },
      { dms:'ICA',      sede:'ICA', sincronizar:false },
      { dms:'JULIACA',  sede:'JUL', sincronizar:false },
      { dms:'PIURA',    sede:'PIU', sincronizar:false },
      { dms:'TRUJILLO', sede:'TRU', sincronizar:false }
    ];
  }
  if(!m.sedes) m.sedes=[];
  if(!m.tipos) m.tipos=[];
  if(!m.subtipos_por_tipo) m.subtipos_por_tipo={};
  if(!m.marcas) m.marcas=[];
  if(!m.modelos_por_marca) m.modelos_por_marca={};
  if(!m.proveedores) m.proveedores=[];
  if(!m.cuenta_mayor_por_tipo) m.cuenta_mayor_por_tipo={};
  if(!m.vendedores) m.vendedores=[];
  m.vendedores.forEach(v=>{ if(!v.tipo_documento) v.tipo_documento='DNI'; if(!v.sedes) v.sedes=[]; if(!v.estado) v.estado='Habilitado'; });
  if(!m.usuarios) m.usuarios=[];
  m.tipos.forEach(t=>{ if(!m.subtipos_por_tipo[t]) m.subtipos_por_tipo[t]=[]; });
  m.marcas.forEach(ma=>{ if(!m.modelos_por_marca[ma]) m.modelos_por_marca[ma]=[]; });

   Artículos/Kits/Cotizaciones. usuarios NUNCA se manda desde acá (tiene su propia pantalla y su
   propio guardarUsuarioEnSheet_ — además, crear/borrar un usuario real pasa por la Edge Function,

/* ---- Metas mensuales por vendedor (punto 5 de "Pendientes solicitados") ----
   Tabla `metas` en Supabase, una fila por {usuario_codigo, año, mes}. El "vendedor" acá es la CUENTA
   que registra la cotización (`usuario_codigo`), no el catálogo maestro.vendedores — decisión del
   usuario, ver el punto 5 en Accesorios_Incamotors.md. Escribe solo Administrador (policy metas_write). */
let metas = {};
function claveMeta(codigoUsuario, anio, mes){ return `${codigoUsuario}__${anio}-${mes}`; }
async function cargarMetas(){

// Guarda los 12 meses de un vendedor para un año de una sola vez (botón "Guardar" por fila del grid).
// Una meta en 0 se borra en vez de guardarse: no ensucia la tabla con filas vacías.
async function guardarMetasFila(codigoUsuario, anio, valoresPorMes){
  const upserts = [], deletes = [];
  for(let mes=1; mes<=12; mes++){
    const clave = claveMeta(codigoUsuario, anio, mes);
    const monto = Number(valoresPorMes[mes])||0;
    if(monto > 0){
      upserts.push({ clave, usuario_codigo:codigoUsuario, anio, mes, monto_meta_soles:monto,
                     registrado_por: currentUser.codigo, fecha_registro: new Date().toISOString() });
    } else if(metas[clave]){
      deletes.push(clave);
    }
  }
  if(upserts.length){
    const { error } = await sb.from('metas').upsert(upserts, {onConflict:'clave'});
    if(error) throw error;
  }
  if(deletes.length){
    const { error } = await sb.from('metas').delete().in('clave', deletes);
    if(error) throw error;
  }
  upserts.forEach(u=>metas[u.clave]=u);
  deletes.forEach(k=>{ delete metas[k]; });
}
async function guardarMaestro(){
  const base = Object.assign({}, maestro);
  delete base.vendedores;
  delete base.usuarios;
  const { error: eBase } = await sb.from('configuracion').update(base).eq('id', true);
  if(eBase) throw eBase;
  const porDni = {}; (maestro.vendedores||[]).forEach(v=>porDni[v.dni]=v);
  const delta = calcularDeltaColeccion_(porDni, snapshotVendedores_);
  if(delta.upserts.length){
    // Sella quién escribió la fila por última vez (columnas `origen`/`actualizado_en`). Se hace acá
    // a propósito, en el ÚNICO punto por donde pasan todos los caminos de escritura manual (alta,
    // edición en línea, toggles de sede/estado, carga masiva), en vez de en cada uno por separado:
    // así un camino de escritura nuevo queda sellado solo, sin depender de acordarse.
    // `origen` significa "quién la escribió por última vez", NO de dónde nació: un vendedor traído
    // del DMS y editado a mano queda 'manual', y volverá a 'dms' en la próxima sincronización.
    // Por eso en la tabla la columna se muestra como "Última edición" y no como "Origen".
    const selloManual = new Date().toISOString();
    delta.upserts.forEach(v=>{ v.origen = 'manual'; v.actualizado_en = selloManual; });
    const { error } = await sb.from('vendedores').upsert(delta.upserts, {onConflict:'dni'});
    if(error) throw error;
  }
  if(delta.deletes.length){
    const { error } = await sb.from('vendedores').delete().in('dni', delta.deletes);
    if(error) throw error;
  }
  snapshotVendedores_ = JSON.parse(JSON.stringify(porDni));
}
let snapshotArticulos_ = {}, snapshotKits_ = {};
function calcularDeltaColeccion_(actual, snapshot){
  const upserts = [];
  const deletes = [];
  Object.keys(actual).forEach(cod=>{
    if(JSON.stringify(actual[cod]) !== JSON.stringify(snapshot[cod])) upserts.push(actual[cod]);
  });
  Object.keys(snapshot).forEach(cod=>{ if(!actual[cod]) deletes.push(cod); });
  return {upserts, deletes};
}
async function cargarCatalogo(){
  const [rArt, rKits] = await Promise.all([sb.from('articulos').select('*'), sb.from('kits').select('*')]);
  if(rArt.error) throw rArt.error;
  if(rKits.error) throw rKits.error;
  const articulos = {}; (rArt.data||[]).forEach(a=>articulos[a.codigo]=a);
  const kits = {}; (rKits.data||[]).forEach(k=>kits[k.codigo]=k);
  catalogo = { articulos, kits };
  migrarCatalogo(catalogo);
  snapshotArticulos_ = JSON.parse(JSON.stringify(catalogo.articulos));
  snapshotKits_ = JSON.parse(JSON.stringify(catalogo.kits));
}
function migrarCatalogo(cat){
  if(!cat.kits) cat.kits={};
  Object.values(cat.kits).forEach(k=>{
    if(!k.componentes) k.componentes=[];
    if(!k.marcas_compatibles) k.marcas_compatibles=[];
    if(!k.modelos_compatibles) k.modelos_compatibles=[];
    if(k.descuento_tipo===undefined) k.descuento_tipo='porcentaje';
    if(k.descuento_valor===undefined) k.descuento_valor=0;
    if(k.codigo_sap===undefined) k.codigo_sap='';
    if(k.cargado_sap===undefined) k.cargado_sap=false;
    delete k.cuenta_mayor; // pasó a depender del Tipo (maestro.cuenta_mayor_por_tipo), ya no se guarda por Kit
    if(k.estado===undefined) k.estado='Activo';
    if(k.descripcion===undefined) k.descripcion='';
  });
  Object.values(cat.articulos||{}).forEach(a=>{
    if(!a.nombre_corto) a.nombre_corto = a.nombre || '';
    if(!a.nombre_largo) a.nombre_largo = a.nombre_corto;
    delete a.nombre;
    if(a.marca_producto===undefined) a.marca_producto = '';
    if(!a.proveedores) a.proveedores = [];
    // Formato viejo: un objeto por proveedor con costos_por_sede{sede:{costo_pen,costo_usd}} (o costo_pen/costo_usd sueltos, más viejo aún).
    // Formato nuevo: una fila plana por cada combinación Proveedor+Sede — {proveedor_codigo, codigos_externos, sede, costo, moneda_costo}.
    if(a.proveedores.some(p=>p.costos_por_sede || p.costo_pen!=null || p.costo_usd!=null)){
      const filasNuevas = [];
      a.proveedores.forEach(p=>{
        const codigos_externos = p.codigos_externos!==undefined ? p.codigos_externos : (p.codigo_externo ? [p.codigo_externo] : []);
        const cps = p.costos_por_sede || (p.costo_pen!=null||p.costo_usd!=null ? Object.fromEntries((maestro.sedes||[]).map(s=>[s,{costo_pen:p.costo_pen,costo_usd:p.costo_usd}])) : {});
        const sedesConDato = Object.keys(cps);
        if(!sedesConDato.length){ filasNuevas.push({ proveedor_codigo:p.proveedor_codigo||null, codigos_externos, sede:(maestro.sedes||[])[0]||'', costo:null, moneda_costo:'PEN' }); return; }
        sedesConDato.forEach(s=>{
          const cs = cps[s]||{};
          const usaPen = cs.costo_pen!=null;
          filasNuevas.push({ proveedor_codigo:p.proveedor_codigo||null, codigos_externos, sede:s, costo: usaPen?cs.costo_pen:(cs.costo_usd!=null?cs.costo_usd:null), moneda_costo: usaPen?'PEN':'USD' });
        });
      });
      a.proveedores = filasNuevas;
    }
    a.proveedores.forEach(p=>{
      if(p.codigos_externos===undefined) p.codigos_externos = [];
      if(p.sede===undefined) p.sede = (maestro.sedes||[])[0]||'';
      if(p.costo===undefined) p.costo = null;
      if(p.moneda_costo===undefined) p.moneda_costo = 'PEN';
    });
    Object.keys(a.precios_por_sede||{}).forEach(s=>{
      const p = a.precios_por_sede[s];
      if(p.precio_venta!==undefined){ if(p.precio_venta_pen===undefined) p.precio_venta_pen = p.precio_venta; delete p.precio_venta; }
      delete p.proveedor; delete p.costo; delete p.costo_pen; delete p.costo_usd;
      if(p.precio_venta_pen===undefined) p.precio_venta_pen = null;
      if(p.precio_venta_usd===undefined) p.precio_venta_usd = null;
    });
    if(a.codigo_sap===undefined || a.codigo_sap===null) a.codigo_sap = codigoSapDe(a.codigo);
    if(a.cargado_sap===undefined) a.cargado_sap = false;
    delete a.cuenta_mayor; // pasó a depender del Tipo (maestro.cuenta_mayor_por_tipo), ya no se guarda por artículo
  });
  return cat;
}

async function guardarCatalogo(){
  const deltaArt = calcularDeltaColeccion_(catalogo.articulos, snapshotArticulos_);
  const deltaKits = calcularDeltaColeccion_(catalogo.kits, snapshotKits_);
  if(deltaArt.upserts.length){
    const { error } = await sb.from('articulos').upsert(deltaArt.upserts, {onConflict:'codigo'});
    if(error) throw error;
  }
  if(deltaArt.deletes.length){
    const { error } = await sb.from('articulos').delete().in('codigo', deltaArt.deletes);
    if(error) throw error;
  }
  if(deltaKits.upserts.length){
    const { error } = await sb.from('kits').upsert(deltaKits.upserts, {onConflict:'codigo'});
    if(error) throw error;
  }
  if(deltaKits.deletes.length){
    const { error } = await sb.from('kits').delete().in('codigo', deltaKits.deletes);
    if(error) throw error;
  }
  snapshotArticulos_ = JSON.parse(JSON.stringify(catalogo.articulos));
  snapshotKits_ = JSON.parse(JSON.stringify(catalogo.kits));
}
/* ---- Cotizaciones: una fila por cotización en la Sheet (clave=codigo, ya prefijado por usuario,
   ej. COT-AQP1-00001) — dos personas cotizando a la vez nunca se pisan porque cada guardado es un
   upsert de una sola fila. `cotizaciones.registros` en memoria es la vista unificada que usa toda la UI. ---- */
async function cargarCotizaciones(){
  const { data, error } = await sb.from('cotizaciones').select('*');
  if(error) throw error;
  const registros = {}; (data||[]).forEach(c=>registros[c.codigo]=c);
  cotizaciones = { registros: migrarCotizaciones_(registros) };
}
async function guardarCotizacionEnArchivo(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  // upsert() evalúa el WITH CHECK de la policy de INSERT (usuario_codigo = current_usuario_codigo())
  // incluso cuando la fila ya existe y termina siendo un UPDATE por el ON CONFLICT — eso rompía cuando
  // Admin/Facturador actualiza una cotización que no es suya (ej. al aprobar un código pendiente desde
  // "Solicitudes de código": propagarAprobacionSolicitud_ reescribe cotizaciones de otros vendedores),
  // porque la policy de INSERT exige ser el dueño, mientras que la de UPDATE sí permite Admin/Facturador
  // sobre cualquier fila. Se intenta UPDATE primero; solo si no existía ninguna fila con ese código
  // (cotización realmente nueva, creada por su propio dueño) se hace el INSERT.
  const { data, error } = await sb.from('cotizaciones').update(c).eq('codigo', codigo).select('codigo');
  if(error) throw traducirErrorEsquema_(error);
  if(!data || !data.length){
    const { error: errIns } = await sb.from('cotizaciones').insert(c);
    if(errIns) throw traducirErrorEsquema_(errIns);
  }
}
// Como acá se manda el objeto de negocio ENTERO a PostgREST, cada clave tiene que existir como columna
// real. Si el HTML se despliega antes de correr el SQL que agrega una columna nueva, PostgREST responde
// un PGRST204 ("Could not find the 'x' column...") que no le dice nada al usuario. Esto lo traduce a un
// mensaje accionable. Se puede simplificar cuando no queden migraciones de esquema pendientes.
function traducirErrorEsquema_(error){
  const msg = String((error && error.message) || '');
  if((error && error.code === 'PGRST204') || /Could not find the .* column/i.test(msg)){
    const col = (/Could not find the '([^']+)' column/i.exec(msg) || [,'?'])[1];
    return new Error(`La base de datos todavía no tiene la columna "${col}" que esta versión del sistema necesita. Hay que correr el SQL de migración pendiente en Supabase antes de seguir guardando. (Detalle: ${msg})`);
  }
  return error;
}
async function borrarCotizacionDeArchivo(codigo){
  if(!cotizaciones.registros[codigo]) return;
  const { error } = await sb.from('cotizaciones').delete().eq('codigo', codigo);
  if(error) throw error;
  delete cotizaciones.registros[codigo];
}

/* ---- Adjuntos de cotización (factura + vouchers) vía Supabase Storage (bucket público
   'cotizaciones-adjuntos', mismo nivel de seguridad que antes con Drive: el link no exige login de
   Google/Supabase, pero nunca se expone fuera de la app ya logueada). Reemplaza al reemplazo anterior
   (a través de Apps Script/Drive) — el campo antes llamado 'driveFileId' ahora es 'storagePath' (la
   ruta del objeto dentro del bucket), 'url' sigue siendo la URL pública para abrir/reemplazar. ---- */
// Nombre interno del archivo = cotización + tipo + correlativo, ej. COT-pyb1-00001/COT-pyb1-00001_FACT_01.pdf
// o .../COT-pyb1-00001_VOUC_02.jpg — así cualquiera que mire el bucket sabe qué es cada archivo sin abrir
// la app. El nombre original que subió el usuario se conserva aparte en nombre_archivo.
const TIPO_ADJUNTO = { factura:'FACT', voucher:'VOUC' };
function nombreAdjuntoCotizacion_(codigo, tipo, numero){
  return `${codigo}_${TIPO_ADJUNTO[tipo]}_${String(numero).padStart(2,'0')}`;
}
// Siguiente correlativo libre de ese tipo, mirando los archivos que la cotización ya tiene (no la cantidad:
// si alguna vez se borra uno, no se reusa su número y no se pisa otro archivo).
function siguienteNumeroAdjunto_(codigo, tipo, adjuntos){
  const re = new RegExp(`_${TIPO_ADJUNTO[tipo]}_(\\d+)\\.`);
  const usados = adjuntos.map(a=>{ const m = re.exec(String((a&&a.storagePath)||'')); return m ? parseInt(m[1],10) : 0; });
  return Math.max(adjuntos.length, ...usados, 0) + 1;
}
async function subirAdjuntoCotizacion_(codigo, nombreBase, file, storagePathAnterior){
  if(storagePathAnterior){
    await sb.storage.from('cotizaciones-adjuntos').remove([storagePathAnterior]).catch(()=>{});
  }
  const extension = (String(file.name).split('.').pop()||'bin').toLowerCase();
  const path = `${codigo}/${nombreBase}.${extension}`;
  const { error } = await sb.storage.from('cotizaciones-adjuntos').upload(path, file, {upsert:true});
  if(error) throw error;
  const { data: pub } = sb.storage.from('cotizaciones-adjuntos').getPublicUrl(path);
  return { storagePath: path, url: pub.publicUrl, nombre_archivo: file.name, fecha_carga: new Date().toISOString() };
}
function abrirAdjuntoCotizacion(url){
  if(!url){ alert('No se pudo abrir el archivo.'); return; }
  window.open(url, '_blank');
}
function extensionDe(nombreArchivo){
  const m = /\.([a-zA-Z0-9]+)$/.exec(nombreArchivo||'');
  return m ? m[1].toLowerCase() : '';
}

/* ---- Router y sidebar (un solo perfil de app, ítems de Mantenimientos/Eliminar/Backup solo para administrador) ---- */
let currentView='catalogo';
let openGroup=0;
const ALL_VIEWS=['catalogo','articulo-form','cotizacion-nueva','cotizacion-lista','cotizacion-detalle','ventas','metas-tablero','comisiones','descuentos','mant-metas','mant-generales','mant-kits','kit-form','mant-carga-masiva','mant-vendedores','mant-proveedores','mant-usuarios','mant-solicitudes','solicitud-codigo','eliminar','backup'];

function gruposVisibles(){
  const cotItems = [];
  if(!esFacturador()) cotItems.push({view:'cotizacion-nueva', label:'Nueva Cotización'});
  cotItems.push({view:'cotizacion-lista', label: puedeVerTodasCotizaciones() ? 'Todas las Cotizaciones' : 'Mis Cotizaciones'});
  cotItems.push({view:'ventas', label: puedeVerTodasCotizaciones() ? 'Ventas' : 'Mis Ventas'});
  // Pedir un código nuevo sin tener que armar una cotización (la de "Nueva Cotización" sigue existiendo).
  cotItems.push({view:'solicitud-codigo', label:'Solicitar código'});
  const g = [
    { view:'catalogo', label:'Catálogo de Artículos' },
    { label:'Cotizaciones', items: cotItems },
    // Reportes: todos los roles entran, pero el rol vendedor ve solo lo suyo (alcanceVendedor()).
    { label:'Reportes', items: (function(){
      const items = [
        { view:'metas-tablero', label: puedeVerTodasCotizaciones() ? 'Metas' : 'Mi Meta' },
        { view:'comisiones',    label: puedeVerTodasCotizaciones() ? 'Comisiones' : 'Mi Comisión' }
      ];
      // "Descuentos por proveedor" es para conciliar pagos a proveedores: solo Admin/Facturador,
      // no es información que corresponda a un vendedor (punto 7).
      if(puedeVerTodasCotizaciones()) items.push({ view:'descuentos', label:'Descuentos por proveedor' });
      return items;
    })() }
  ];
  if(esAdministrador() || esFacturador()){
    const pendientesSolicitud = Object.values(solicitudesArticulo||{}).filter(s=>s.estado==='Pendiente').length;
    const mantItems = [];
    if(esAdministrador()){
      mantItems.push(
        {view:'mant-generales', label:'Catálogos generales'},
        {view:'mant-metas', label:'Cargar Metas'},
        {view:'mant-kits', label:'Kits'},
        {view:'mant-carga-masiva', label:'Carga Masiva'},
        {view:'mant-vendedores', label:'Vendedores'},
        {view:'mant-proveedores', label:'Proveedores'},
        {view:'mant-usuarios', label:'Usuarios'}
      );
    } else if(puedeSincronizarVendedores()){
      // El Facturador ve Vendedores solo para poder sincronizar con el DMS; la pantalla se renderiza
      // en modo lectura (sin alta, edición en línea, borrado ni carga masiva).
      mantItems.push({view:'mant-vendedores', label:'Vendedores'});
    }
    mantItems.push({view:'mant-solicitudes', label:'Solicitudes de código'+(pendientesSolicitud?` (${pendientesSolicitud})`:'')});
    if(esAdministrador()) mantItems.push({view:'eliminar', label:'Eliminar registros'});
    g.push({ label:'Mantenimientos', items: mantItems });
  }
  if(esAdministrador()) g.push({ view:'backup', label:'Backup' });
  return g;
}
function grupoIndexParaVista(view){
  const grupos = gruposVisibles();
  for(let i=0;i<grupos.length;i++){ if(grupos[i].items && grupos[i].items.some(it=>it.view===view)) return i; }
  return openGroup;
}
function renderSidebar(){
  const el = document.getElementById('sidebar-app');
  const grupos = gruposVisibles();
  el.innerHTML = grupos.map((g,gi)=>{
    if(!g.items){
      return `<button class="group-header ${currentView===g.view?'active-group':''}" data-flatview="${g.view}">${g.label}</button>`;
    }
    const isOpen = gi===openGroup;
    const header = `<button class="group-header ${isOpen?'active-group':''}" data-gi="${gi}">${g.label}<span class="chevron" style="transform:rotate(${isOpen?90:0}deg)">&#9656;</span></button>`;
    const items = isOpen ? `<div class="group-items">${g.items.map(it=>`<button data-view="${it.view}" class="${currentView===it.view?'active':''}">${it.label}</button>`).join('')}</div>` : '';
    return header+items;
  }).join('');
  el.querySelectorAll('.group-header[data-gi]').forEach(b=>{
    b.onclick = ()=>{ const gi=Number(b.dataset.gi); openGroup = openGroup===gi?-1:gi; renderSidebar(); };
  });
  el.querySelectorAll('[data-flatview]').forEach(b=> b.onclick = ()=>switchView(b.dataset.flatview));
  el.querySelectorAll('[data-view]').forEach(b=> b.onclick = ()=>switchView(b.dataset.view));
}
function switchView(view){
  currentView = view;
  openGroup = grupoIndexParaVista(view);
  renderSidebar();
  ALL_VIEWS.forEach(v=>{ const s=document.getElementById('view-'+v); if(s) s.style.display='none'; });
  document.getElementById('view-'+view).style.display='block';
  if(view==='catalogo') renderCatalogo();
  else if(view==='articulo-form') renderArticuloForm();
  else if(view==='cotizacion-nueva') renderCotizacionNueva();
  else if(view==='cotizacion-lista') renderCotizacionLista();
  else if(view==='cotizacion-detalle') renderCotizacionDetalle();
  else if(view==='ventas') renderVentas();
  else if(view==='metas-tablero') renderMetasTablero();
  else if(view==='comisiones') renderComisiones();
  else if(view==='descuentos') renderDescuentos();
  else if(view==='mant-metas') renderMantMetas();
  else if(view==='mant-generales') renderMantGenerales();
  else if(view==='mant-kits') renderMantKits();
  else if(view==='kit-form') renderKitForm();
  else if(view==='mant-carga-masiva') renderCargaMasivaArticulos();
  else if(view==='mant-vendedores') renderMantVendedores();
  else if(view==='mant-proveedores') renderMantProveedores();
  else if(view==='mant-usuarios') renderMantUsuarios();
  else if(view==='mant-solicitudes') renderMantSolicitudes();
  else if(view==='solicitud-codigo') renderSolicitudCodigo();
  else if(view==='eliminar') renderEliminar();
  else if(view==='backup') renderBackup();
}

  });

function articuloCoincideFiltro(a){
  if(catFiltros.tipo.length && !catFiltros.tipo.includes(a.tipo)) return false;
  if(catFiltros.subtipo.length && !catFiltros.subtipo.includes(a.subtipo)) return false;
  if(catFiltros.marca.length && a.marcas_compatibles.length && !catFiltros.marca.some(m=>a.marcas_compatibles.includes(m))) return false;
  if(catFiltros.modelo.length && a.modelos_compatibles.length && !catFiltros.modelo.some(m=>a.modelos_compatibles.includes(m))) return false;
  if(esAdministrador()){ if(catFiltros.estado && a.estado!==catFiltros.estado) return false; }
  else if(a.estado!=='Activo') return false;
  const q=(catFiltros.buscar||'').toLowerCase();
  if(q && !(a.codigo.toLowerCase().includes(q) || (a.codigo_sap||'').toLowerCase().includes(q) || a.nombre_corto.toLowerCase().includes(q) || a.nombre_largo.toLowerCase().includes(q) || (a.marca_producto||'').toLowerCase().includes(q) || (a.proveedores||[]).some(p=>(p.codigos_externos||[]).some(ce=>ce.toLowerCase().includes(q))))) return false;
  return true;
}

    const p = a.precios_por_sede[catSedeActiva]||{};

      <td><span class="cod">${a.codigo}</span></td>

      <td>${a.tipo}</td>

      <td style="font-size:11.5px;color:var(--muted)">${compat}</td>

      <td>${p.precio_venta_usd!=null ? '$ '+Number(p.precio_venta_usd).toFixed(2) : '<span style="color:var(--muted)">-</span>'}</td>
      ${esAdministrador()?`<td><span class="badge ${a.estado==='Activo'?'b-ok':'b-bad'}">${a.estado}</span></td>`:''}
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr[data-codigo]').forEach(tr=>{
    tr.onclick = ()=>{

      else mostrarDetalleArticulo(tr.dataset.codigo);

function mostrarDetalleArticulo(codigo){
  const a = catalogo.articulos[codigo];

  let txt = `${a.nombre_largo}${a.codigo_sap?(' — SAP: '+a.codigo_sap):''}\n${a.marca_producto?('Marca: '+a.marca_producto+'\n'):''}Tipo: ${a.tipo} / ${a.subtipo}\n`;

function afCostoDerivado(costoVal, moneda){
  if(costoVal===''||costoVal==null||isNaN(Number(costoVal))) return { pen:null, usd:null };
  const num = Number(costoVal);
  if(moneda==='USD') return { pen: num*afTcDolaresASoles(), usd: num };
  return { pen: num, usd: num/afTcSolesADolares() };
}
function afVincularCodigoSap(){
  const inCodigo = document.getElementById('af-codigo');
  const inSap = document.getElementById('af-codigo-sap');
  if(!inCodigo || !inSap) return; // al editar, el código no es editable, así que no hay nada que vincular
  inSap.dataset.autoval = inSap.value;
  inCodigo.oninput = ()=>{
    if(inSap.value==='' || inSap.value===inSap.dataset.autoval){
      const sugerido = codigoSapDe(inCodigo.value.trim());
      inSap.value = sugerido;
      inSap.dataset.autoval = sugerido;
    }
  };
}
function afRecalcularFilaMB(idx){
  const tr = document.querySelector(`#af-precios tr[data-fila-idx="${idx}"]`);
  if(!tr) return;
  const costoVal = document.getElementById('af-fila-'+idx+'-costo').value;
  const moneda = document.getElementById('af-fila-'+idx+'-moneda').value;
  const { pen: costoPen, usd: costoUsd } = afCostoDerivado(costoVal, moneda);
  const precioPenStr = document.getElementById('af-fila-'+idx+'-precio-pen').value;
  const precioUsdStr = document.getElementById('af-fila-'+idx+'-precio-usd').value;
  const precioPen = precioPenStr===''?null:Number(precioPenStr);
  const precioUsd = precioUsdStr===''?null:Number(precioUsdStr);
  const mbPen = (precioPen!=null && costoPen!=null) ? precioPen-costoPen : null;
  const mbUsd = (precioUsd!=null && costoUsd!=null) ? precioUsd-costoUsd : null;
  tr.querySelector('.af-mb-pen').textContent = mbPen!=null ? 'S/ '+mbPen.toFixed(2) : '-';
  tr.querySelector('.af-mb-pen-pct').textContent = (mbPen!=null && precioPen>0) ? (mbPen/precioPen*100).toFixed(1)+'%' : '-';
  tr.querySelector('.af-mb-usd').textContent = mbUsd!=null ? '$ '+mbUsd.toFixed(2) : '-';
  tr.querySelector('.af-mb-usd-pct').textContent = (mbUsd!=null && precioUsd>0) ? (mbUsd/precioUsd*100).toFixed(1)+'%' : '-';
}
function afPrecioPenOnInput(idx){
  const inPen = document.getElementById('af-fila-'+idx+'-precio-pen');
  const inUsd = document.getElementById('af-fila-'+idx+'-precio-usd');
  if(inUsd.value==='' || inUsd.value===inUsd.dataset.autoval){
    const sugerido = inPen.value==='' ? '' : (Number(inPen.value)/afTcSolesADolares()).toFixed(2);
    inUsd.value = sugerido;
    inUsd.dataset.autoval = sugerido;
  }
  afRecalcularFilaMB(idx);
}
function afPrecioVentaOnBlur(){

function afLeerFilasProveedor(){

    const idx = tr.dataset.filaIdx;

    const costo = costoStr===''?null:Number(costoStr);

function afLeerPreciosVenta(){
  const nuevo = {};

    const idx = tr.dataset.filaIdx;
    const sede = document.getElementById('af-fila-'+idx+'-sede').value;
    if(!sede || nuevo[sede]) return;
    const pen = document.getElementById('af-fila-'+idx+'-precio-pen').value;
    const usd = document.getElementById('af-fila-'+idx+'-precio-usd').value;

function afRenderProveedoresYPrecios(){
  const sedes = maestro.sedes||[];
  const tbody = document.getElementById('af-precios');
  if(!afProveedorFilas.length){
    tbody.innerHTML = `<tr><td colspan="12" class="empty">Sin registros agregados — el artículo no tendrá costo de referencia para el MB.</td></tr>`;

  }
  tbody.innerHTML = afProveedorFilas.map((p,idx)=>{
    const sede = p.sede && sedes.includes(p.sede) ? p.sede : (sedes[0]||'');
    const pv = afPreciosVenta[sede]||{};
    const { pen: costoPen, usd: costoUsd } = afCostoDerivado(p.costo, p.moneda_costo);
    const mbPen = (pv.precio_venta_pen!=null && costoPen!=null) ? pv.precio_venta_pen-costoPen : null;
    const mbUsd = (pv.precio_venta_usd!=null && costoUsd!=null) ? pv.precio_venta_usd-costoUsd : null;

      <td><input id="af-fila-${idx}-skus" value="${escAttr((p.codigos_externos||[]).join(', '))}" placeholder="SKU-1, SKU-2" style="width:150px"></td>
      <td><input type="number" step="0.01" id="af-fila-${idx}-costo" value="${p.costo!=null?p.costo:''}" oninput="afRecalcularFilaMB(${idx})" style="width:90px"></td>
      <td><select id="af-fila-${idx}-moneda" onchange="afRecalcularFilaMB(${idx})"><option value="PEN" ${p.moneda_costo!=='USD'?'selected':''}>Soles</option><option value="USD" ${p.moneda_costo==='USD'?'selected':''}>Dólares</option></select></td>
      <td><input type="number" step="0.01" id="af-fila-${idx}-precio-pen" value="${pv.precio_venta_pen!=null?pv.precio_venta_pen:''}" oninput="afPrecioPenOnInput(${idx})" onblur="afPrecioVentaOnBlur()" style="width:90px"></td>
      <td><input type="number" step="0.01" id="af-fila-${idx}-precio-usd" value="${pv.precio_venta_usd!=null?pv.precio_venta_usd:''}" data-autoval="${pv.precio_venta_usd!=null?pv.precio_venta_usd:''}" oninput="afRecalcularFilaMB(${idx})" onblur="afPrecioVentaOnBlur()" style="width:90px"></td>
      <td class="af-mb-pen">${mbPen!=null?('S/ '+mbPen.toFixed(2)):'-'}</td>
      <td class="af-mb-pen-pct">${(mbPen!=null && pv.precio_venta_pen>0)?((mbPen/pv.precio_venta_pen*100).toFixed(1)+'%'):'-'}</td>
      <td class="af-mb-usd">${mbUsd!=null?('$ '+mbUsd.toFixed(2)):'-'}</td>
      <td class="af-mb-usd-pct">${(mbUsd!=null && pv.precio_venta_usd>0)?((mbUsd/pv.precio_venta_usd*100).toFixed(1)+'%'):'-'}</td>
      <td><span style="cursor:pointer;color:var(--danger);font-weight:700" onclick="afQuitarFilaProveedor(${idx})">&times;</span></td>
    </tr>`;
  }).join('');
}

// Nomenclatura única ACC = DMS = SAP (LOGICA_DEL_NEGOCIO.md 5.12): ACC-00001 → SAP/DMS 92-ACC-00001.
const PREFIJO_CODIGO_ARTICULO = 'ACC-';
function generarCodigoArticulo(){
  let n=1;
  while(catalogo.articulos[PREFIJO_CODIGO_ARTICULO+String(n).padStart(5,'0')]) n++;
  return PREFIJO_CODIGO_ARTICULO+String(n).padStart(5,'0');
}

/* ---- Kits: cálculo de precio y costo (no se guarda precio propio, se deriva de los componentes) ---- */
function generarCodigoKit(){
  let n=1;
  while((catalogo.kits||{})['KIT-'+String(n).padStart(5,'0')]) n++;
  return 'KIT-'+String(n).padStart(5,'0');
}
function kitPrecioListaSede(kit, sede){
  let pen=0, usd=0, incompleto=false;
  (kit.componentes||[]).forEach(c=>{
    const art = catalogo.articulos[c.codigo_articulo];
    const p = art ? (art.precios_por_sede||{})[sede] : null;
    if(!art || !p || p.precio_venta_pen==null){ incompleto=true; return; }
    pen += p.precio_venta_pen * c.cantidad;
    usd += (p.precio_venta_usd!=null?p.precio_venta_usd:0) * c.cantidad;
  });
  return { pen, usd, incompleto };
}
function kitDescuentoAplicado(kit, pen, usd, tipoCambio){
  if(kit.descuento_tipo==='monto_fijo'){
    const descPen = Number(kit.descuento_valor)||0;
    const descUsd = tipoCambio ? descPen/tipoCambio : 0;
    return { pen: Math.max(0, pen-descPen), usd: Math.max(0, usd-descUsd) };
  }
  const f = 1 - Math.min(Math.max(Number(kit.descuento_valor)||0,0),100)/100;
  return { pen: pen*f, usd: usd*f };
}
function kitPrecioFinalSede(kit, sede){
  const lista = kitPrecioListaSede(kit, sede);
  const desc = kitDescuentoAplicado(kit, lista.pen, lista.usd, maestro.tipo_cambio||3.35);
  return {
    precio_lista_pen: lista.pen, precio_lista_usd: lista.usd,
    precio_venta_pen: Number(desc.pen.toFixed(2)), precio_venta_usd: Number(desc.usd.toFixed(2)),
    incompleto: lista.incompleto
  };
}
function kitCostoMinSede(kit, sede){
  let costoPen = 0, completo = true;
  (kit.componentes||[]).forEach(c=>{
    const art = catalogo.articulos[c.codigo_articulo];
    if(!art){ completo=false; return; }
    const filas = (art.proveedores||[]).filter(p=>p.sede===sede && p.costo!=null);
    if(!filas.length){ completo=false; return; }
    const costosPen = filas.map(p=> p.moneda_costo==='USD' ? p.costo*tcGlobalDolaresASoles() : p.costo);
    costoPen += Math.min(...costosPen) * c.cantidad;
  });
  return { costoPen, completo };
}
/* Al aprobar una solicitud de código: reemplaza el código temporal por el real en TODAS las
   cotizaciones que lo usaban (nombre/tipo/subtipo también se actualizan; el precio solo si el
   artículo final tiene precio para la sede/moneda de esa cotización puntual — si no, se conserva el
   precio sugerido que ya tenía). Cada cotización afectada se guarda de nuevo en ACC pero, a propósito,
   NO se vuelve a sincronizar con Maryana — solo el guardado inicial de la cotización migra allá. */
async function propagarAprobacionSolicitud_(codigoSolicitud, codigoArticuloFinal){
  const art = catalogo.articulos[codigoArticuloFinal];
  if(!art) return;
  for(const c of Object.values(cotizaciones.registros)){
    let cambiado = false;
    (c.items||[]).forEach(it=>{
      if(it.codigo_articulo === codigoSolicitud){
        const p = (art.precios_por_sede||{})[c.sede]||{};
        const precioFinal = c.moneda==='USD' ? p.precio_venta_usd : p.precio_venta_pen;
        it.codigo_articulo = codigoArticuloFinal;
        it.nombre_corto = art.nombre_corto;
        it.nombre_largo = art.nombre_largo;
        it.tipo = art.tipo;
        it.subtipo = art.subtipo;
        if(precioFinal!=null){ it.precio_unitario = precioFinal; it.subtotal = precioFinal*it.cantidad; }
        delete it.es_solicitud;
        cambiado = true;
      }
    });
    if(cambiado){
      c.total = c.items.reduce((s,itm)=>s+itm.subtotal,0);
      await guardarCotizacionEnArchivo(c.codigo);
    }
  }
}
async function guardarArticuloForm(){

  const nombreCorto = document.getElementById('af-nombre-corto').value.trim();
  if(!nombreCorto){ msg.textContent='El nombre corto es obligatorio.'; msg.className='msg err'; return; }
  const nombreLargo = document.getElementById('af-nombre-largo').value.trim() || nombreCorto;
  const tipo = document.getElementById('af-tipo').value;
  const subtipo = document.getElementById('af-subtipo').value;
  if(!tipo || !subtipo){ msg.textContent='Selecciona tipo y subtipo.'; msg.className='msg err'; return; }
  const marca_producto = document.getElementById('af-marca-producto').value;
  const marcas_compatibles = afMarcasMarcadas();
  const modelos_compatibles = afModelosSeleccionadosActuales();
  afLeerFilasProveedor();
  afLeerPreciosVenta();
  const proveedores = afProveedorFilas.filter(p=> p.proveedor_codigo || (p.codigos_externos&&p.codigos_externos.length) || p.costo!=null);
  const precios_por_sede = afPreciosVenta;
  let codigo;
  if(editingArticuloCodigo){
    codigo = editingArticuloCodigo;
  }else{
    codigo = document.getElementById('af-codigo').value.trim();
    if(!codigo){ msg.textContent='El código es obligatorio.'; msg.className='msg err'; return; }
    if(catalogo.articulos[codigo]){ msg.textContent=`El código "${codigo}" ya existe (artículo "${catalogo.articulos[codigo].nombre_corto}") — usa otro código o edita ese artículo.`; msg.className='msg err'; return; }
  }
  const codigo_sap = document.getElementById('af-codigo-sap').value.trim();
  // El código SAP es también el código del DMS (llave del cruce ACC ↔ DMS): no puede repetirse.
  const sapDuplicado = codigo_sap && Object.values(catalogo.articulos).find(x=> x.codigo!==codigo && x.codigo_sap===codigo_sap);
  if(sapDuplicado){ msg.textContent=`El código SAP "${codigo_sap}" ya lo usa el artículo ${sapDuplicado.codigo} ("${sapDuplicado.nombre_corto}").`; msg.className='msg err'; return; }
  const cargado_sap = document.getElementById('af-cargado-sap').checked;
  const existente = catalogo.articulos[codigo];
  catalogo.articulos[codigo] = {
    codigo, codigo_sap, cargado_sap, nombre_corto: nombreCorto, nombre_largo: nombreLargo, marca_producto, descripcion: document.getElementById('af-desc').value.trim(),
    tipo, subtipo, marcas_compatibles, modelos_compatibles, proveedores, precios_por_sede,
    estado: document.getElementById('af-estado').value,
    fecha_registro: existente ? existente.fecha_registro : new Date().toISOString(),
    registrado_por: existente ? existente.registrado_por : currentUser.codigo
  };
  if(aprobandoSolicitudCodigo){
    // Camino de aprobación de solicitud: se mantiene bloqueante a propósito (await, no en segundo
    // plano) — la lógica de reintento de abajo (propagacion_pendiente_codigo) necesita saber con
    // certeza que el artículo ya quedó creado en el servidor antes de decidir el siguiente paso.
    await guardarCatalogo();
    const solCodigo = aprobandoSolicitudCodigo;
    // El artículo YA quedó creado en catalogo.articulos en este punto (guardarCatalogo ya terminó) —
    // si algo de acá para abajo falla (ej. una respuesta lenta/caída del servidor), NO hay que volver
    // a intentar recrear el artículo (duplicaría el código) — se guarda cuál quedó pendiente de
    // propagar en la propia solicitud, para que "Reintentar" (ver aprobarSolicitudCodigo) retome
    // directo desde la propagación, sin pasar de nuevo por este formulario.
    try{
      await propagarAprobacionSolicitud_(solCodigo, codigo);
      const sol = solicitudesArticulo[solCodigo];
      if(sol){
        sol.estado = 'Aprobada';
        sol.codigo_articulo_final = codigo;
        sol.aprobado_por = currentUser.codigo;
        sol.aprobado_en = new Date().toISOString();
        delete sol.propagacion_pendiente_codigo;
        await guardarSolicitudArticuloEnArchivo(solCodigo);
      }
      aprobandoSolicitudCodigo = null;
      editingArticuloCodigo = null;
      switchView('mant-solicitudes');
    }catch(e){
      const sol = solicitudesArticulo[solCodigo];
      if(sol){
        sol.propagacion_pendiente_codigo = codigo;
        try{ await guardarSolicitudArticuloEnArchivo(solCodigo); }catch(e2){ /* mejor esfuerzo — igual queda el aviso de abajo */ }
      }
      aprobandoSolicitudCodigo = null;
      editingArticuloCodigo = null;
      switchView('mant-solicitudes');
      alert(`El artículo ${codigo} se creó correctamente, pero no se pudo terminar de actualizar la cotización de origen ni marcar la solicitud como aprobada (${e.message}). Usa "Reintentar" en Solicitudes de código — no hace falta crear el artículo de nuevo.`);
    }
    return;
  }
  // Camino simple (alta/edición normal, sin aprobación de solicitud de por medio): UI optimista —
  // ya se navega, el guardado real va en segundo plano con reintentos.
  editingArticuloCodigo = null;
  switchView('catalogo');
  guardarEnSegundoPlano_(`artículo ${codigo}`, guardarCatalogo);
}
async function eliminarArticuloPuntual(codigo){
  const kitsQueLoUsan = Object.values(catalogo.kits||{}).filter(k=>(k.componentes||[]).some(c=>c.codigo_articulo===codigo));
  const advertenciaKits = kitsQueLoUsan.length ? `\n\nADVERTENCIA: este artículo es componente de ${kitsQueLoUsan.length} Kit(s) (${kitsQueLoUsan.map(k=>k.codigo).join(', ')}) — esos Kits quedarán con un componente faltante.` : '';
  if(!confirm('¿Eliminar el artículo '+codigo+'? Esta acción no se puede deshacer.'+advertenciaKits)) return;
  delete catalogo.articulos[codigo];
  editingArticuloCodigo = null;
  switchView('catalogo');
  guardarEnSegundoPlano_(`eliminación del artículo ${codigo}`, guardarCatalogo);
}

/* ---- Carga Masiva de Artículos (solo administrador) ---- */
// La columna CÓDIGO es la primera y es OPCIONAL: vacía = artículo nuevo (código autogenerado); con un
// código que ya existe = se ACTUALIZA ese artículo. Es lo que permite subir precios en masa sin tener
// que editar artículo por artículo. Va primera para que al exportar el catálogo y volver a pegarlo el
// orden calce solo.
function columnasPlantillaArticulos(){
  const base = ['CÓDIGO','NOMBRE CORTO','NOMBRE LARGO','DESCRIPCIÓN','MARCA','TIPO','SUBTIPO','MARCAS COMPATIBLES','MODELOS COMPATIBLES','PROVEEDOR 1','COSTO 1','MONEDA COSTO 1','PROVEEDOR 2','COSTO 2','MONEDA COSTO 2'];
  const sedeCols = (maestro.sedes||[]).map(s=>'PRECIO VENTA S/ '+s);
  return base.concat(sedeCols);
}
// Plantilla PRELLENADA con el catálogo actual (mismo patrón que el importador de liquidaciones del
// sistema F&I). Sin esto el upsert por código sería inusable: habría que buscar a mano el código de
// cada artículo. Se descarga, se editan los precios en Excel y se vuelve a pegar.
function descargarCatalogoComoPlantilla(){
  const sedes = maestro.sedes||[];
  const filas = Object.values(catalogo.articulos||{})
    .sort((a,b)=> String(a.codigo).localeCompare(String(b.codigo)))
    .map(a=>{
      // Primeros dos registros Proveedor+Sede distintos, que es lo que admite la plantilla.
      const provs = [];
      (a.proveedores||[]).forEach(p=>{
        if(provs.length>=2) return;
        if(provs.some(x=>x.proveedor_codigo===p.proveedor_codigo)) return;
        provs.push(p);
      });
      const celdaProv = (p)=>{
        if(!p) return ['','',''];
        const prov = (maestro.proveedores||[]).find(x=>x.codigo===p.proveedor_codigo);
        return [prov?prov.nombre:'', p.costo!=null?String(p.costo):'', p.moneda_costo||'PEN'];
      };
      return [
        a.codigo, a.nombre_corto||'', a.nombre_largo||'', a.descripcion||'', a.marca_producto||'',
        a.tipo||'', a.subtipo||'',
        (a.marcas_compatibles||[]).join(','), (a.modelos_compatibles||[]).join(','),
        ...celdaProv(provs[0]), ...celdaProv(provs[1]),
        ...sedes.map(s=>{ const p=(a.precios_por_sede||{})[s]; return p&&p.precio_venta_pen!=null?String(p.precio_venta_pen):''; })
      ].join('\t');
    });
  const contenido = columnasPlantillaArticulos().join('\t') + '\n' + filas.join('\n') + '\n';
  const blob = new Blob([contenido], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `catalogo_articulos_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

let articulosImportPreview = [];
function analizarImportacionArticulos(){
  const texto = document.getElementById('art-import-textarea').value;
  const lineas = texto.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim().length>0);
  const resultado = document.getElementById('art-import-resultado');
  if(lineas.length<2){ resultado.innerHTML = '<p class="msg err">Pega los datos con encabezado y al menos una fila.</p>'; return; }
  const sedes = maestro.sedes||[];
  const tipoCambio = maestro.tipo_cambio||3.35;
  const validas = []; const errores = [];
  const codigosEnArchivo = {};
  const reCodigoNuevo = new RegExp('^'+PREFIJO_CODIGO_ARTICULO+'\\d{5}$');
  lineas.slice(1).forEach((linea, idx)=>{
    const c = linea.split('\t');
    const numFila = idx+2;
    const codigoFila = (c[0]||'').trim().toUpperCase();
    if(codigoFila){
      if(codigosEnArchivo[codigoFila]){ errores.push(`Fila ${numFila}: el código "${codigoFila}" ya viene en la fila ${codigosEnArchivo[codigoFila]}. No puede haber códigos repetidos.`); return; }
      codigosEnArchivo[codigoFila] = numFila;
    }
    const nombreCorto = (c[1]||'').trim();
    const nombreLargo = (c[2]||'').trim() || nombreCorto;
    const descripcion = (c[3]||'').trim();
    const marcaProd = (c[4]||'').trim();
    const tipo = (c[5]||'').trim();
    const subtipo = (c[6]||'').trim();
    const marcasCompat = (c[7]||'').split(',').map(x=>x.trim()).filter(Boolean);
    const modelosCompat = (c[8]||'').split(',').map(x=>x.trim()).filter(Boolean);
    const existente = codigoFila ? catalogo.articulos[codigoFila] : null;
    // Código que no existe: se crea con ESE código, pero solo si respeta la nomenclatura ACC-00001
    // (su SAP/DMS será 92-ACC-00001). Así el Excel de migración puede traer los códigos ya asignados.
    if(codigoFila && !existente){
      if(!reCodigoNuevo.test(codigoFila)){ errores.push(`Fila ${numFila}: el código "${codigoFila}" no existe en el catálogo y no tiene el formato ${PREFIJO_CODIGO_ARTICULO}00001. Déjalo vacío para que se genere solo.`); return; }
      const sapOcupado = Object.values(catalogo.articulos).find(x=>x.codigo_sap===codigoSapDe(codigoFila));
      if(sapOcupado){ errores.push(`Fila ${numFila}: el código SAP "${codigoSapDe(codigoFila)}" ya lo usa el artículo ${sapOcupado.codigo}.`); return; }
    }
    if(!nombreCorto){ errores.push(`Fila ${numFila}: falta el nombre corto.`); return; }
    if(!maestro.tipos.includes(tipo)){ errores.push(`Fila ${numFila}: el tipo "${tipo}" no existe en el catálogo.`); return; }
    if(!(maestro.subtipos_por_tipo[tipo]||[]).includes(subtipo)){ errores.push(`Fila ${numFila}: el subtipo "${subtipo}" no existe para el tipo "${tipo}".`); return; }
    const proveedores = [];
    [[(c[9]||'').trim(),(c[10]||'').trim(),(c[11]||'').trim()], [(c[12]||'').trim(),(c[13]||'').trim(),(c[14]||'').trim()]].forEach(([nombreProv, costoStr, monedaStr])=>{
      if(!nombreProv && !costoStr) return;
      const prov = (maestro.proveedores||[]).find(p=>p.nombre.toLowerCase()===nombreProv.toLowerCase());
      const costo = costoStr===''?null:Number(costoStr);
      const moneda_costo = monedaStr.toUpperCase()==='USD' ? 'USD' : 'PEN';
      if(costo!=null) sedes.forEach(s=>{ proveedores.push({ proveedor_codigo: prov?prov.codigo:null, codigos_externos:[], sede:s, costo, moneda_costo }); });
      if(nombreProv && !prov) errores.push(`Fila ${numFila}: no se encontró el proveedor "${nombreProv}" (el costo se guarda sin proveedor asignado).`);
    });
    const precios_por_sede = {};
    sedes.forEach((s,i)=>{
      const val = (c[15+i]||'').trim();
      if(val!==''){
        const pen = Number(val);
        precios_por_sede[s] = { precio_venta_pen: pen, precio_venta_usd: Number((pen/tipoCambio).toFixed(2)) };
      }
    });
    validas.push({ codigo: codigoFila||null, esActualizacion: !!existente, nombre_corto:nombreCorto, nombre_largo:nombreLargo, descripcion, marca_producto:marcaProd, tipo, subtipo, marcas_compatibles:marcasCompat, modelos_compatibles:modelosCompat, proveedores, precios_por_sede });
  });
  articulosImportPreview = validas;
  const nNuevos = validas.filter(v=>!v.esActualizacion).length;
  const nActualiza = validas.filter(v=>v.esActualizacion).length;
  const detalleActualiza = validas.filter(v=>v.esActualizacion).map(v=>`${v.codigo} — ${v.nombre_largo||v.nombre_corto}`);
  resultado.innerHTML = `
    <p class="msg ${validas.length?'ok':'err'}">${nNuevos} artículo(s) a crear · ${nActualiza} a actualizar.</p>
    ${nActualiza?`<p class="msg" style="background:var(--gold-soft);border-color:var(--gold-line)"><strong>Se van a sobrescribir ${nActualiza} artículo(s) existente(s)</strong> con los datos de la plantilla:</p><ul style="font-size:12px;color:var(--muted);max-height:160px;overflow:auto">${detalleActualiza.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
    ${errores.length?`<p class="msg err">${errores.length} fila(s) con problemas:</p><ul style="font-size:12px;color:var(--danger)">${errores.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}
    ${validas.length?`<button class="btn btn-amber" onclick="ejecutarImportacionArticulos()">Confirmar${nNuevos?` y crear ${nNuevos}`:''}${nActualiza?`${nNuevos?', ':' y '}actualizar ${nActualiza}`:''}</button>`:''}
  `;
}
async function ejecutarImportacionArticulos(){
  const nNuevos = articulosImportPreview.filter(v=>!v.esActualizacion).length;
  const nActualiza = articulosImportPreview.filter(v=>v.esActualizacion).length;
  // Primero las filas con código propio, después las autogeneradas: así un código generado nunca
  // "pisa" uno que viene explícito más abajo en el mismo archivo.
  const orden = v=> v.esActualizacion ? 0 : (v.codigo ? 1 : 2);
  articulosImportPreview.slice().sort((a,b)=>orden(a)-orden(b)).forEach(v=>{
    if(v.esActualizacion){
      // Actualización: se pisan solo los campos que trae la plantilla y se CONSERVA todo lo demás
      // (código SAP editado a mano, cargado_sap, estado, fecha/usuario de alta y los códigos externos
      // de cada proveedor). Sobrescribir el artículo entero borraría trabajo hecho desde la ficha.
      const prev = catalogo.articulos[v.codigo];
      // Los códigos externos viven por Proveedor+Sede y la plantilla no los trae: se recuperan del
      // registro previo que coincida en proveedor y sede.
      const proveedores = v.proveedores.map(nuevo=>{
        const anterior = (prev.proveedores||[]).find(p=>p.proveedor_codigo===nuevo.proveedor_codigo && p.sede===nuevo.sede);
        return Object.assign({}, nuevo, { codigos_externos: (anterior && anterior.codigos_externos) || [] });
      });
      catalogo.articulos[v.codigo] = Object.assign({}, prev, {
        nombre_corto:v.nombre_corto, nombre_largo:v.nombre_largo, marca_producto:v.marca_producto, descripcion:v.descripcion,
        tipo:v.tipo, subtipo:v.subtipo, marcas_compatibles:v.marcas_compatibles, modelos_compatibles:v.modelos_compatibles,
        proveedores,
        // Los precios se FUSIONAN por sede: una plantilla que solo trae la columna de AQP no debe
        // borrar los precios de las demás sedes.
        precios_por_sede: Object.assign({}, prev.precios_por_sede||{}, v.precios_por_sede)
        // Sin sello de "última modificación": `articulos` guarda columnas planas y agregarlo exige
        // columnas nuevas (ver "Auditoría" en las mejoras evaluadas y no priorizadas).
      });
    } else {
      const codigo = v.codigo || generarCodigoArticulo();
      catalogo.articulos[codigo] = {
        codigo, codigo_sap: codigoSapDe(codigo), cargado_sap:false,
        nombre_corto:v.nombre_corto, nombre_largo:v.nombre_largo, marca_producto:v.marca_producto, descripcion:v.descripcion,
        tipo:v.tipo, subtipo:v.subtipo, marcas_compatibles:v.marcas_compatibles, modelos_compatibles:v.modelos_compatibles,
        proveedores:v.proveedores, precios_por_sede:v.precios_por_sede,
        estado:'Activo', fecha_registro:new Date().toISOString(), registrado_por:currentUser.codigo
      };
    }
  });
  await guardarCatalogo();
  articulosImportPreview = [];
  document.getElementById('art-import-textarea').value = '';
  document.getElementById('art-import-resultado').innerHTML = `<p class="msg ok">Listo: ${nNuevos} artículo(s) creado(s) y ${nActualiza} actualizado(s).</p>`;
}

  document.getElementById('cn-buscar').oninput = (e)=>{ cnBuscarFiltros.texto=e.target.value; cnRefrescarResultados(); };

}

function cnArticulosDisponibles(){
  const marcaVeh = document.getElementById('cn-marca')?.value || '';
  const modeloVeh = document.getElementById('cn-modelo')?.value || '';
  const q = (cnBuscarFiltros.texto||'').toLowerCase();
  return Object.values(catalogo.articulos).filter(a=>{
    if(a.estado!=='Activo') return false;
    if(marcaVeh && a.marcas_compatibles.length && !a.marcas_compatibles.includes(marcaVeh)) return false;
    if(modeloVeh && a.modelos_compatibles.length && !a.modelos_compatibles.includes(modeloVeh)) return false;
    if(cnBuscarFiltros.tipo.length && !cnBuscarFiltros.tipo.includes(a.tipo)) return false;
    if(cnBuscarFiltros.subtipo.length && !cnBuscarFiltros.subtipo.includes(a.subtipo)) return false;
    if(cnBuscarFiltros.marca.length && a.marcas_compatibles.length && !cnBuscarFiltros.marca.some(m=>a.marcas_compatibles.includes(m))) return false;
    if(q && !(a.nombre_corto.toLowerCase().includes(q) || a.nombre_largo.toLowerCase().includes(q) || a.codigo.toLowerCase().includes(q) || (a.codigo_sap||'').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>a.nombre_corto.localeCompare(b.nombre_corto));
}
function cnKitsDisponibles(){
  const marcaVeh = document.getElementById('cn-marca')?.value || '';
  const modeloVeh = document.getElementById('cn-modelo')?.value || '';
  const q = (cnBuscarFiltros.texto||'').toLowerCase();
  return Object.values(catalogo.kits||{}).filter(k=>{
    if(k.estado!=='Activo') return false;
    if(marcaVeh && k.marcas_compatibles.length && !k.marcas_compatibles.includes(marcaVeh)) return false;
    if(modeloVeh && k.modelos_compatibles.length && !k.modelos_compatibles.includes(modeloVeh)) return false;
    if(cnBuscarFiltros.marca.length && k.marcas_compatibles.length && !cnBuscarFiltros.marca.some(m=>k.marcas_compatibles.includes(m))) return false;
    if(q && !(k.nombre_corto.toLowerCase().includes(q) || k.nombre_largo.toLowerCase().includes(q) || k.codigo.toLowerCase().includes(q) || (k.codigo_sap||'').toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b)=>a.nombre_corto.localeCompare(b.nombre_corto));
}
const CN_MAX_RESULTADOS = 200;
function cnRefrescarResultados(){
  const tbody = document.getElementById('cn-resultados-tbody');

  const simbolo = simboloMoneda(moneda);

  const kitsFiltrados = (cnBuscarFiltros.tipo.length || cnBuscarFiltros.subtipo.length) ? [] : cnKitsDisponibles();
  const disponibles = [...cnArticulosDisponibles(), ...kitsFiltrados].sort((a,b)=>a.nombre_corto.localeCompare(b.nombre_corto));

    ? `Mostrando ${CN_MAX_RESULTADOS} de ${disponibles.length} — usa el buscador o los filtros para acotar.`
    : `${disponibles.length} artículo(s)/kit(s) encontrado(s).`;

      precio = pinfo.incompleto ? null : (moneda==='USD' ? pinfo.precio_venta_usd : pinfo.precio_venta_pen);

    }
    return `<tr data-codigo="${escAttr(item.codigo)}">
      <td><span class="cod">${item.codigo}</span> ${esKit?'<span class="badge b-info" style="padding:1px 6px;font-size:10px">KIT</span>':''}</td>
      <td>${item.nombre_largo||item.nombre_corto}</td>
      <td style="font-size:11px;color:var(--muted)">${esKit?'Kit ('+(item.componentes||[]).length+' art.)':(item.tipo+' / '+item.subtipo)}</td>
      <td>${precio!=null ? simbolo+' '+Number(precio).toFixed(2) : '<span style="color:var(--muted)">Sin precio</span>'}</td>
      <td><input type="number" min="1" value="1" class="cn-res-cant" style="width:64px;padding:5px" ${precio==null?'disabled':''}></td>
      <td>${precio!=null ? `<button class="btn btn-primary" style="padding:5px 10px;font-size:11.5px" onclick="cnAgregarItemDesdeFila(this)">+ Agregar</button>` : ''}</td>

function cnAgregarItem(codigo, cantidad){
  const kit = catalogo.kits && catalogo.kits[codigo];
  if(kit) return cnAgregarKit(kit, cantidad);
  const msg = document.getElementById('cn-item-msg');
  const a = catalogo.articulos[codigo];
  if(!a){ msg.textContent='Artículo no encontrado.'; msg.className='msg err'; return; }
  const moneda = cotForm.moneda;
  const p = a.precios_por_sede[cotForm.sede]||{};
  const precio = moneda==='USD' ? p.precio_venta_usd : p.precio_venta_pen;
  if(precio==null){ msg.textContent='Ese artículo no tiene precio en '+nombreMoneda(moneda)+' para la sede '+cotForm.sede+'.'; msg.className='msg err'; return; }
  if(cantidad<1){ msg.textContent='La cantidad debe ser al menos 1.'; msg.className='msg err'; return; }
  cotizacionItems.push({ codigo_articulo:a.codigo, nombre_corto:a.nombre_corto, nombre_largo:a.nombre_largo, tipo:a.tipo, subtipo:a.subtipo, cantidad, precio_unitario:precio, subtotal: precio*cantidad });

function cnAgregarKit(kit, cantidad){
  const msg = document.getElementById('cn-item-msg');
  if(cantidad<1){ msg.textContent='La cantidad debe ser al menos 1.'; msg.className='msg err'; return; }
  const pinfo = kitPrecioFinalSede(kit, cotForm.sede);
  if(pinfo.incompleto){ msg.textContent='Este Kit tiene componentes sin precio en la sede '+cotForm.sede+'.'; msg.className='msg err'; return; }
  const precio = cotForm.moneda==='USD' ? pinfo.precio_venta_usd : pinfo.precio_venta_pen;
  const componentesSnapshot = (kit.componentes||[]).map(c=>{
    const art = catalogo.articulos[c.codigo_articulo];
    return { codigo_articulo:c.codigo_articulo, nombre_corto: art?art.nombre_corto:c.codigo_articulo, nombre_largo: art?(art.nombre_largo||art.nombre_corto):c.codigo_articulo, cantidad:c.cantidad };
  });
  cotizacionItems.push({ codigo_articulo:kit.codigo, nombre_corto:kit.nombre_corto, nombre_largo:kit.nombre_largo, tipo:'Kit', subtipo:'', cantidad, precio_unitario:precio, subtotal:precio*cantidad, es_kit:true, componentes_snapshot:componentesSnapshot });
  msg.textContent='';
  cnRenderItems();
}
/* ---- Solicitar código nuevo: para cuando quien cotiza no encuentra el artículo en el catálogo.
   No crea el artículo directo — genera un código temporal (SOL-00001) que viaja en la cotización
   como cualquier otro ítem hasta que el Administrador lo apruebe (ver Mantenimientos → Solicitudes
   de código) y recién ahí se crea el artículo real y se reemplaza el código en todas las cotizaciones
   que lo usaban. ---- */
/* ---- Selector de compatibilidad (marcas + modelos de vehículo) reutilizable, mismo comportamiento que el
   de la ficha de artículo: los modelos se filtran por las marcas marcadas; vacío = todas/todos. Se usa en
   "Solicitar código nuevo" (desde la cotización) y en el módulo "Solicitar código" (sin cotización). ---- */
function htmlSelectorCompat(pre){
  return `<div class="grid" style="margin-top:10px">
      <div><p class="eyebrow" style="margin:0 0 6px">Marcas compatibles (vacío = todas)</p><div id="${pre}-marcas" style="display:flex;flex-wrap:wrap;gap:10px"></div></div>
      <div><p class="eyebrow" style="margin:0 0 6px">Modelos compatibles (vacío = todos)</p><div id="${pre}-modelos" style="display:flex;flex-wrap:wrap;gap:10px;max-height:180px;overflow:auto"></div></div>
    </div>`;
}
function compatMarcas(pre){ return [...document.querySelectorAll(`#${pre}-marcas input:checked`)].map(c=>c.value); }
function compatModelos(pre){ return [...document.querySelectorAll(`#${pre}-modelos input:checked`)].map(c=>c.value); }
function compatRender(pre, marcasSel, modelosSel){
  const el = document.getElementById(pre+'-marcas'); if(!el) return;
  el.innerHTML = (maestro.marcas||[]).map(m=>
    `<label class="check-row"><input type="checkbox" value="${escAttr(m)}" ${(marcasSel||[]).includes(m)?'checked':''} onchange="compatRenderModelos('${pre}', compatModelos('${pre}'))"> ${m}</label>`
  ).join('') || '<p class="sub">Sin marcas configuradas.</p>';
  compatRenderModelos(pre, modelosSel||[]);
}
function compatRenderModelos(pre, seleccionados){
  const marcas = compatMarcas(pre);
  const disponibles = marcas.length
    ? [...new Set(marcas.flatMap(m=>maestro.modelos_por_marca[m]||[]))]
    : [...new Set(Object.values(maestro.modelos_por_marca||{}).flat())];
  document.getElementById(pre+'-modelos').innerHTML = disponibles.map(mo=>
    `<label class="check-row"><input type="checkbox" value="${escAttr(mo)}" ${(seleccionados||[]).includes(mo)?'checked':''}> ${mo}</label>`
  ).join('') || '<p class="sub">Selecciona una marca para ver sus modelos, o deja vacío para "todos".</p>';
}
function textoCompat(marcas, modelos){
  const m = (marcas||[]).length ? marcas.join(', ') : 'Todas las marcas';
  return (modelos||[]).length ? `${m} · ${modelos.join(', ')}` : m;
}

function generarCodigoSolicitud(){
  let n=1;
  const usados = new Set(Object.keys(solicitudesArticulo||{}));
  cotizacionItems.forEach(it=>{ if(it.es_solicitud) usados.add(it.codigo_articulo); });
  while(usados.has('SOL-'+String(n).padStart(5,'0'))) n++;
  return 'SOL-'+String(n).padStart(5,'0');
}
