// Punto 7: el bloque de descuento aparece solo cuando el bruto alcanza algún tramo configurado, y el
// % escrito se valida contra el tope de ese tramo. El total mostrado es siempre el NETO.
function cnRefrescarDescuento(){
  const bruto = cotizacionItems.reduce((s,it)=>s+it.subtotal,0);
  const simbolo = simboloMoneda(cotForm.moneda);
  const wrap = document.getElementById('cn-descuento-wrap');
  const inp = document.getElementById('cn-descuento-pct');
  const info = document.getElementById('cn-descuento-info');
  const msg = document.getElementById('cn-descuento-msg');
  const tope = topeDescuentoPct(bruto);
  let pct = 0;
  if(wrap && inp){
    if(tope > 0){
      wrap.style.display = 'block';
      pct = parseFloat(inp.value)||0;
      if(pct < 0) pct = 0;
      if(pct > tope){
        if(msg){ msg.textContent = `El máximo para esta venta es ${tope}%.`; msg.className='msg err'; }
        pct = tope; inp.value = tope;
      } else if(msg){ msg.textContent=''; msg.className='msg'; }
      const tramo = tramoAplicable(bruto);
      if(info) info.innerHTML = `Hasta <strong>${tope}%</strong> porque la venta supera ${simbolo} ${Number(tramo.desde).toFixed(2)}. Subtotal ${simbolo} ${bruto.toFixed(2)} · descuento ${simbolo} ${(bruto*pct/100).toFixed(2)}`;
    } else {
      wrap.style.display = 'none';
      inp.value = 0;
      if(info) info.textContent = '';
      if(msg){ msg.textContent=''; msg.className='msg'; }
    }
  }
  const el = document.getElementById('cn-total');
  if(el) el.textContent = (bruto - bruto*pct/100).toFixed(2);
}
function generarCodigoCotizacion(codigoUsuario, registros){
  let n=1;
  const prefijo = 'COT-'+codigoUsuario+'-';
  while(registros[prefijo+String(n).padStart(5,'0')]) n++;
  return prefijo+String(n).padStart(5,'0');
}
const DIAS_VIGENCIA_COTIZACION = 7;
async function guardarCotizacion(){
  const msg = document.getElementById('cn-msg');
  const nombreCliente = document.getElementById('cn-cliente-nombre').value.trim();
  if(!nombreCliente){ msg.textContent='El nombre del cliente es obligatorio.'; msg.className='msg err'; return; }
  const vendedorDni = document.getElementById('cn-vendedor').value;
  const vendedor = (maestro.vendedores||[]).find(v=>v.dni===vendedorDni);
  if(!vendedor){ msg.textContent='Selecciona el vendedor asignado.'; msg.className='msg err'; return; }
  const vinPlaca = document.getElementById('cn-vin').value.trim();
  if(!vinPlaca){ msg.textContent='El VIN/PLACA es obligatorio.'; msg.className='msg err'; return; }
  if(!cotizacionItems.length){ msg.textContent='Agrega al menos un artículo.'; msg.className='msg err'; return; }
  const codigo = generarCodigoCotizacion(currentUser.codigo, cotizaciones.registros);
  // Punto 7: `total` guarda el NETO (lo que paga el cliente). El bruto y el descuento se guardan
  // aparte para el desglose y para el reporte de descuentos por proveedor.
  const subtotalBruto = cotizacionItems.reduce((s,it)=>s+it.subtotal,0);
  const topePct = topeDescuentoPct(subtotalBruto);
  const inpDesc = document.getElementById('cn-descuento-pct');
  let descuentoPct = topePct>0 ? (parseFloat(inpDesc && inpDesc.value)||0) : 0;
  if(descuentoPct < 0) descuentoPct = 0;
  if(descuentoPct > topePct){ msg.textContent=`El descuento máximo para esta venta es ${topePct}%.`; msg.className='msg err'; return; }
  const descuentoMonto = subtotalBruto * descuentoPct/100;
  const total = subtotalBruto - descuentoMonto;
  const fechaRegistro = new Date();
  const vigenciaHasta = new Date(fechaRegistro.getTime() + DIAS_VIGENCIA_COTIZACION*24*60*60*1000);
  cotizaciones.registros[codigo] = {
    codigo, fecha_registro: fechaRegistro.toISOString(), vigencia_hasta: vigenciaHasta.toISOString(), sede: cotForm.sede, moneda: cotForm.moneda,
    estado:'Vigente', reemplaza_a: modificandoCodigoOrigen||null, reemplazada_por:null,
    estado_facturacion:null, enviada_a_facturar_en:null, observacion_facturacion:'', factura_adjunto:null, facturas:[], vouchers:[],
    vendedor:{ dni:vendedor.dni, nombre:vendedor.nombre },
    cliente:{ nombre:nombreCliente, tipo_documento:document.getElementById('cn-cliente-tipodoc').value, documento:document.getElementById('cn-cliente-documento').value.trim(), telefono:document.getElementById('cn-cliente-telefono').value.trim(), email:document.getElementById('cn-cliente-email').value.trim() },
    vehiculo:{ marca:document.getElementById('cn-marca').value, modelo:document.getElementById('cn-modelo').value, vin:vinPlaca },
    items: cotizacionItems.slice(),
    subtotal_bruto: subtotalBruto, descuento_pct: descuentoPct, descuento_monto: descuentoMonto,
    total,
    usuario_codigo: currentUser.codigo, usuario_nombre: currentUser.nombre
  };
  if(modificandoCodigoOrigen && cotizaciones.registros[modificandoCodigoOrigen]){
    cotizaciones.registros[modificandoCodigoOrigen].estado = 'Reemplazada';
    cotizaciones.registros[modificandoCodigoOrigen].reemplazada_por = codigo;
  }
  // Ítems que se agregaron como "solicitar código nuevo" (sin artículo real todavía): recién ahora que
  // la cotización tiene su código definitivo se crea la solicitud de verdad (así nunca queda una
  // solicitud huérfana si el usuario arma el borrador y no llega a guardar la cotización). Se registra
  // en memoria ya mismo, junto con el resto de la mutación — el guardado real va más abajo.
  const codigosSolicitud = [];
  for(const it of cotizacionItems){
    if(!it.es_solicitud) continue;
    if(solicitudesArticulo[it.codigo_articulo]) continue; // ya existía (ej. al modificar una cotización que ya la traía) — no la pisa
    solicitudesArticulo[it.codigo_articulo] = {
      codigo: it.codigo_articulo, estado:'Pendiente',
      nombre: it.nombre_largo||it.nombre_corto, tipo: it.tipo||'', subtipo: it.subtipo||'',
      marcas_compatibles: it.marcas_compatibles||[], modelos_compatibles: it.modelos_compatibles||[], comentario: null,
      precio_sugerido: it.precio_unitario, moneda: cotForm.moneda, sede_origen: cotForm.sede,
      cotizacion_origen: codigo, solicitado_por: currentUser.codigo, solicitado_por_nombre: currentUser.nombre,
      solicitado_en: fechaRegistro.toISOString(),
      codigo_articulo_final:null, aprobado_por:null, aprobado_en:null, motivo_rechazo:null
    };
    codigosSolicitud.push(it.codigo_articulo);
  }

  // UI optimista: la mutación en memoria ya está lista — feedback y reseteo del formulario ocurren
  // YA, sin esperar al servidor. El guardado real (y la copia a Maryana) siguen abajo en segundo plano.
  const codigoOrigenAGuardar = modificandoCodigoOrigen;
  msg.innerHTML = `Cotización <b>${codigo}</b> guardada. <button class="btn btn-primary" style="margin-left:8px;padding:5px 10px;font-size:11.5px" onclick="generarPDFCotizacion('${codigo}')">Generar PDF</button>`;
  msg.className='msg ok';
  modificandoCodigoOrigen = null;
  cotPrefill = null;
  cotizacionItems = [];
  document.getElementById('cn-cliente-nombre').value='';
  document.getElementById('cn-cliente-telefono').value='';
  document.getElementById('cn-cliente-documento').value='';
  document.getElementById('cn-cliente-email').value='';
  document.getElementById('cn-vin').value='';
  cnRenderItems();

  // Guardado real en segundo plano, con reintentos (ver guardarEnSegundoPlano_) — no bloquea la
  // pantalla. Son upserts idempotentes (mismo código = misma fila), seguros de reintentar.
  guardarEnSegundoPlano_(`cotización ${codigo}`, ()=>Promise.all([
    guardarCotizacionEnArchivo(codigo),
    codigoOrigenAGuardar ? guardarCotizacionEnArchivo(codigoOrigenAGuardar) : Promise.resolve() // puede vivir en el archivo de otro usuario (ej. Admin modificando una cotización ajena)
  ]));
  codigosSolicitud.forEach(cod=> guardarEnSegundoPlano_(`solicitud de código ${cod}`, ()=>guardarSolicitudArticuloEnArchivo(cod)));

  // Maryana: intento único, NO se reintenta acá — su acción 'crearCotizacion' no es idempotente
  // (crea una fila nueva cada vez), reintentarla duplicaría la cotización allá. Ya tiene su propio
  // manejo de error; solo se avisa por notificación en vez de bloquear el formulario.
  sincronizarCotizacionConMaryana_(codigo).catch(e=>{
    mostrarNotificacionError_(`Cotización ${codigo} guardada en ACC, pero no se pudo copiar a Maryana: ${e.message}`);
  });
}

let cotListaFiltros = { anio:new Date().getFullYear(), mes:new Date().getMonth()+1, sede:[], usuario:[], vendedor:[], estado:'', facturacion:'', buscar:'' };
let cotListaFiltrosInicializadoPara = null;
let verCotizacionCodigo = null;
function badgeEstadoCotizacion(estado){
  return estado==='Reemplazada' ? `<span class="badge b-bad">Reemplazada</span>` : `<span class="badge b-ok">Vigente</span>`;
}
// true si la cotización tiene algún ítem con código temporal (solicitud de código) sin aprobar todavía —
// mientras eso no se resuelve, no se puede facturar (el artículo/precio final todavía puede cambiar).
function cotizacionTieneSolicitudPendiente(c){
  return (c.items||[]).some(it=>it.es_solicitud);
}
function badgeFacturacion(ef){
  if(!ef) return `<span class="badge b-abierto">Sin enviar</span>`;
  if(ef==='Facturada') return `<span class="badge b-ok">Facturada</span>`;
  if(ef==='Facturada parcial') return `<span class="badge b-info">Facturada parcial</span>`;
  if(ef==='Observada') return `<span class="badge b-bad">Observada</span>`;
  return `<span class="badge b-warn">Pendiente</span>`;
}

/* ---- Facturación con Anticipos (punto 1 de "Pendientes solicitados", Accesorios_Incamotors.md) ----
   Una cotización puede facturarse en VARIOS documentos: N anticipos parciales + un saldo, hasta llegar
   al 100% del total. La lista vive en la columna jsonb `cotizaciones.facturas`; `factura_adjunto` (el
   objeto único del modelo viejo) quedó deprecado y lo migra migrarCotizaciones_() a facturas[0].
   El estado_facturacion Pendiente/Facturada parcial/Facturada se DERIVA de la suma de facturas — una
   sola fuente de verdad sobre la plata; 'Observada' es la única marca manual (ver recalcularEstadoFacturacion). */
const TOLERANCIA_FACTURACION = 0.05; // margen de redondeo de IGV al comparar la suma contra el total
function facturasDe(c){ return c.facturas || []; }
function totalFacturado(c){ return facturasDe(c).reduce((s,f)=>s+(Number(f.monto)||0), 0); }
function saldoPendienteFacturacion(c){ return (Number(c.total)||0) - totalFacturado(c); }
function pctFacturado(c){
  const t = Number(c.total)||0;
  return t>0 ? Math.min(100, (totalFacturado(c)/t)*100) : 0;
}
function facturaCompleta(c){ return totalFacturado(c) + TOLERANCIA_FACTURACION >= (Number(c.total)||0); }
// Estado que corresponde a la cotización según lo que realmente se facturó. No contempla 'Observada'
// (es una marca manual que recalcularEstadoFacturacion respeta, no un punto del avance).
function estadoFacturacionCalculado(c){
  if(!c.estado_facturacion && !facturasDe(c).length) return null; // todavía no se envió a facturar
  if(totalFacturado(c) <= 0) return 'Pendiente';
  return facturaCompleta(c) ? 'Facturada' : 'Facturada parcial';
}
function recalcularEstadoFacturacion(c){
  if(c.estado_facturacion==='Observada') return; // marca manual: no la pisa el cálculo automático
  c.estado_facturacion = estadoFacturacionCalculado(c);
}
// Una cotización deja de ser modificable apenas se emitió la PRIMERA factura (no recién al llegar al
// 100%, como era antes de los anticipos): si se cambian los montos después de facturar un anticipo, la
// cotización queda desincronizada contra un documento tributario ya emitido.
function puedeModificarCotizacion(c){
  const esDueño = c.usuario_codigo===currentUser.codigo;
  return (esDueño || esAdministrador()) && c.estado==='Vigente' && !facturasDe(c).length && c.estado_facturacion!=='Facturada';
}
function siguienteIdFactura_(c){
  const usados = facturasDe(c).map(f=>parseInt(String(f.id||'').replace(/\D/g,''),10)||0);
  return 'F' + ((usados.length ? Math.max(...usados) : 0) + 1);
}
// Convierte el modelo viejo (factura_adjunto: objeto único = una factura por el 100%) al nuevo. Solo en
// memoria, igual que migrarCatalogo() — la fila no se reescribe hasta que se guarde por otro motivo.
function migrarCotizaciones_(registros){
  Object.values(registros).forEach(c=>{
    if(!Array.isArray(c.facturas)) c.facturas = [];
    if(c.facturas.length) return;
    if(c.factura_adjunto){
      c.facturas = [{
        id:'F1', tipo:'Saldo', numero:'', monto: Number(c.total)||0,
        fecha: (c.factura_adjunto.fecha_carga||'').slice(0,10),
        adjunto: c.factura_adjunto,
        registrado_por: c.factura_adjunto.cargado_por||'', fecha_registro: c.factura_adjunto.fecha_carga||''
      }];
    } else if(c.estado_facturacion==='Facturada'){
      // Se marcó Facturada sin adjuntar el PDF (posible en el modelo viejo). Se conserva el estado y el
      // monto, con adjunto null — el PDF obligatorio rige para facturas nuevas, no retroactivamente.
      c.facturas = [{
        id:'F1', tipo:'Saldo', numero:'', monto: Number(c.total)||0,
        fecha:'', adjunto:null, registrado_por:'', fecha_registro:''
      }];
    }
  });
  return registros;
}

}

// Filtro compartido entre la tabla en pantalla y "Exportar a Excel" (exportarCotizacionesFacturadoCSV) —
// para que el export siempre coincida exactamente con lo que el administrador está viendo filtrado.
function cotizacionesListaFiltradas_(){
  const q = (cotListaFiltros.buscar||'').toLowerCase();
  return Object.values(cotizaciones.registros).filter(c=>{
    if(!puedeVerTodasCotizaciones() && c.usuario_codigo!==currentUser.codigo) return false;
    const f = new Date(c.fecha_registro);
    if(cotListaFiltros.anio && f.getFullYear()!==cotListaFiltros.anio) return false;
    if(cotListaFiltros.mes && (f.getMonth()+1)!==cotListaFiltros.mes) return false;
    if(!msFiltraArray(cotListaFiltros.sede, c.sede)) return false;
    if(!msFiltraArray(cotListaFiltros.vendedor, (c.vendedor||{}).dni)) return false;
    if(puedeVerTodasCotizaciones() && !msFiltraArray(cotListaFiltros.usuario, c.usuario_codigo)) return false;
    if(cotListaFiltros.estado && (c.estado||'Vigente')!==cotListaFiltros.estado) return false;
    if(cotListaFiltros.facturacion==='ninguno'){ if(c.estado_facturacion) return false; }
    else if(cotListaFiltros.facturacion && (c.estado_facturacion||'')!==cotListaFiltros.facturacion) return false;
    if(q && !c.cliente.nombre.toLowerCase().includes(q) && !(c.cliente.documento||'').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> new Date(b.fecha_registro)-new Date(a.fecha_registro));
}

// Helper genérico de exportación a .csv (mismo patrón que descargarCSV del sistema F&I): BOM UTF-8 para
// que Excel/Windows detecte bien los acentos, separador coma, comillas si el campo trae coma/comilla/salto
// de línea. Reutilizar este helper para cualquier "exportar a Excel" nuevo, no reinventar el CSV a mano.
function descargarCSV(nombreArchivo, encabezados, filas){
  const escCsv = v=>{
    const s = v===null||v===undefined ? '' : String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lineas = [encabezados.map(escCsv).join(','), ...filas.map(fila=>fila.map(escCsv).join(','))];
  const csv = '﻿'+lineas.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// Punto 4 de "Pendientes solicitados" (Accesorios_Incamotors.md): exportar el detalle de todo lo
// facturado, solo Administrador. Exporta exactamente las filas que el filtro de "Todas las Cotizaciones"
// está mostrando en ese momento (mismo criterio que "Mi comisión confirmada" del sistema F&I) — para
// exportar solo lo facturado, el admin filtra Facturación="Facturada" antes de exportar.
function exportarCotizacionesFacturadoCSV(){
  const filas = cotizacionesListaFiltradas_();
  if(!filas.length){ alert('No hay cotizaciones que coincidan con los filtros actuales.'); return; }
  const encabezados = ['Código','Fecha registro','Sede','Cliente','Documento cliente','Marca','Modelo','VIN/Placa','Vendedor','Usuario','Moneda','Total','Op. Gravada','IGV','Estado','Estado facturación','N° de facturas','Total facturado','Saldo pendiente','% facturado','Facturas','Observación facturación'];
  const datos = filas.map(c=>{
    const opGravada = c.total/(1+IGV_TASA);
    const igv = c.total-opGravada;
    const fs = facturasDe(c);
    return [
      c.codigo, new Date(c.fecha_registro).toLocaleDateString('es-PE'), c.sede,
      c.cliente.nombre, c.cliente.documento||'',
      c.vehiculo.marca||'', c.vehiculo.modelo||'', c.vehiculo.vin||'',
      (c.vendedor||{}).nombre||'', c.usuario_nombre||'',
      nombreMoneda(c.moneda), c.total.toFixed(2), opGravada.toFixed(2), igv.toFixed(2),
      c.estado||'Vigente', c.estado_facturacion||'Sin enviar',
      fs.length, totalFacturado(c).toFixed(2), saldoPendienteFacturacion(c).toFixed(2), pctFacturado(c).toFixed(1)+'%',
      fs.map(f=>`${f.tipo}${f.numero?' '+f.numero:''}: ${(Number(f.monto)||0).toFixed(2)}`).join(' | '),
      c.observacion_facturacion||''
    ];
  });
  descargarCSV(`cotizaciones_facturado_${new Date().toISOString().slice(0,10)}.csv`, encabezados, datos);
}
// Segundo export: una fila por FACTURA emitida (no por cotización), para conciliar documento por
// documento. Respeta los mismos filtros que la tabla en pantalla, igual que el export de arriba.
function exportarFacturasDetalleCSV(){
  const cots = cotizacionesListaFiltradas_();
  const encabezados = ['N° factura','Tipo','Fecha factura','Monto','Moneda','Op. Gravada','IGV','Archivo','Cotización','Fecha cotización','Sede','Cliente','Documento cliente','Marca','Modelo','VIN/Placa','Vendedor','Usuario','Total cotización','Registrada por'];
  const datos = [];
  cots.forEach(c=>{
    facturasDe(c).forEach(f=>{
      const monto = Number(f.monto)||0;
      const opGravada = monto/(1+IGV_TASA);
      datos.push([
        f.numero||'', f.tipo||'', f.fecha ? new Date(f.fecha+'T00:00:00').toLocaleDateString('es-PE') : '',
        monto.toFixed(2), nombreMoneda(c.moneda), opGravada.toFixed(2), (monto-opGravada).toFixed(2),
        f.adjunto ? f.adjunto.nombre_archivo : 'Sin archivo',
        c.codigo, new Date(c.fecha_registro).toLocaleDateString('es-PE'), c.sede,
        c.cliente.nombre, c.cliente.documento||'',
        c.vehiculo.marca||'', c.vehiculo.modelo||'', c.vehiculo.vin||'',
        (c.vendedor||{}).nombre||'', c.usuario_nombre||'', (Number(c.total)||0).toFixed(2),
        f.registrado_por||''
      ]);
    });
  });
  if(!datos.length){ alert('Las cotizaciones que coinciden con los filtros actuales todavía no tienen ninguna factura registrada.'); return; }
  descargarCSV(`detalle_facturas_${new Date().toISOString().slice(0,10)}.csv`, encabezados, datos);
}
async function pasarAFacturar(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  if(cotizacionTieneSolicitudPendiente(c)){ alert('Esta cotización tiene un código temporal pendiente de aprobación — no se puede enviar a facturación hasta que Administración o Facturación lo apruebe o rechace (Mantenimientos → Solicitudes de código).'); return; }
  if(!(c.vouchers && c.vouchers.length)){
    alert('Debes cargar al menos un voucher de pago antes de enviar esta cotización a facturación. Te llevamos al detalle para que lo cargues.');
    verCotizacionCodigo = codigo;
    switchView('cotizacion-detalle');
    return;
  }
  if(!confirm('¿Enviar la cotización '+codigo+' a facturación?')) return;
  c.estado_facturacion = 'Pendiente';
  c.enviada_a_facturar_en = new Date().toISOString();
  await guardarCotizacionEnArchivo(codigo);
  renderCotizacionListaTabla();
  try{
    await aprobarCotizacionEnMaryana_(codigo);
  }catch(e){
    alert('Se envió a facturación en ACC, pero no se pudo actualizar el estado en Maryana: '+e.message);
  }
}

async function guardarEstadoFacturacion(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  // El estado ya no se elige de una lista: Pendiente/Facturada parcial/Facturada los deriva
  // recalcularEstadoFacturacion() de las facturas registradas. Acá solo se pone o se quita la marca
  // manual "Observada" (quitarla devuelve la cotización al estado que le corresponde por sus montos).
  const observada = document.getElementById('cd-observada').checked;
  c.estado_facturacion = observada ? 'Observada' : estadoFacturacionCalculado(c);
  c.observacion_facturacion = document.getElementById('cd-observacion').value.trim();
  await guardarCotizacionEnArchivo(codigo);
  renderCotizacionDetalle();
}

async function agregarFacturaCotizacion(codigo){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  if(!puedeFacturar()){ alert('No tienes permiso para registrar facturas.'); return; }
  const msg = document.getElementById('cd-f-msg');
  const btn = document.getElementById('cd-f-btn');
  const tipo = document.getElementById('cd-f-tipo').value;
  const numero = document.getElementById('cd-f-numero').value.trim();
  const fecha = document.getElementById('cd-f-fecha').value;
  const monto = parseFloat(document.getElementById('cd-f-monto').value);
  const file = document.getElementById('cd-f-archivo').files[0];
  const error = t=>{ msg.textContent=t; msg.className='msg err'; };
  if(!numero){ return error('Ingresa el N° de factura.'); }
  if(!fecha){ return error('Ingresa la fecha de la factura.'); }
  if(!(monto>0)){ return error('El monto debe ser mayor a 0.'); }
  if(!file){ return error('Adjunta el PDF de la factura — es obligatorio.'); }
  // Bloqueo por exceso: facturar por encima de lo cotizado casi siempre es un error de tipeo. Si el
  // monto real cambió, corresponde corregir la cotización con "Modificar", no pasarse acá.
  const saldo = saldoPendienteFacturacion(c);
  if(monto > saldo + TOLERANCIA_FACTURACION){
    return error(`El monto supera el saldo pendiente (${simboloMoneda(c.moneda)} ${saldo.toFixed(2)}). Si el importe real cambió, corrige la cotización con "Modificar".`);
  }
  if(btn){ btn.disabled=true; btn.textContent='Subiendo…'; }
  try{
    const id = siguienteIdFactura_(c);
    // FACT_01 corresponde a la factura F1, FACT_02 a F2… (mismo número que su id)
    const adjunto = await subirAdjuntoCotizacion_(codigo, nombreAdjuntoCotizacion_(codigo, 'factura', id.replace(/\D/g,'')), file, null);
    if(!Array.isArray(c.facturas)) c.facturas = [];
    c.facturas.push({
      id, tipo, numero, monto, fecha,
      adjunto: Object.assign(adjunto, { cargado_por: currentUser.codigo }),
      registrado_por: currentUser.codigo, fecha_registro: new Date().toISOString()
    });
    // Registrar una factura resuelve una observación previa: el estado vuelve a salir de los montos.
    if(c.estado_facturacion==='Observada') c.estado_facturacion = null;
    recalcularEstadoFacturacion(c);
    await guardarCotizacionEnArchivo(codigo);
    renderCotizacionDetalle();
  }catch(e){
    error('No se pudo registrar la factura: '+e.message);
    if(btn){ btn.disabled=false; btn.textContent='Agregar factura'; }
  }
}
async function borrarFacturaCotizacion(codigo, id){
  const c = cotizaciones.registros[codigo];
  if(!c) return;
  if(!puedeFacturar()){ alert('No tienes permiso para quitar facturas.'); return; }
  const f = facturasDe(c).find(x=>x.id===id);
  if(!f) return;
  if(!confirm(`¿Quitar la factura ${f.numero||f.id} de ${simboloMoneda(c.moneda)} ${(Number(f.monto)||0).toFixed(2)}? El archivo adjunto también se elimina.`)) return;
  if(f.adjunto && f.adjunto.storagePath){
    await sb.storage.from('cotizaciones-adjuntos').remove([f.adjunto.storagePath]).catch(()=>{});
  }
  c.facturas = facturasDe(c).filter(x=>x.id!==id);
  recalcularEstadoFacturacion(c);
  await guardarCotizacionEnArchivo(codigo);
  renderCotizacionDetalle();
}
async function cargarVoucherCotizacion(codigo){
  const c = cotizaciones.registros[codigo];
  const input = document.getElementById('cd-voucher-input');
  const msg = document.getElementById('cd-voucher-msg');
  const btn = document.getElementById('cd-voucher-btn');

  if(!c.vouchers) c.vouchers=[];
  if(btn){ btn.disabled=true; btn.textContent='Subiendo…'; }
  try{
    const nombre = nombreAdjuntoCotizacion_(codigo, 'voucher', siguienteNumeroAdjunto_(codigo, 'voucher', c.vouchers));

}

    if(ventasFiltros.mes && (f.getMonth()+1)!==ventasFiltros.mes) return false;
    if(!msFiltraArray(ventasFiltros.sede, c.sede)) return false;
    if(ventasFiltros.tipo.length && !tiposDeCotizacion(c).some(t=>ventasFiltros.tipo.includes(t))) return false;
    if(!msFiltraArray(ventasFiltros.vendedor, (c.vendedor||{}).dni)) return false;
    if(ventasFiltros.estadoFacturacion && c.estado_facturacion!==ventasFiltros.estadoFacturacion) return false;

/* ==== Descuentos por tramo compartidos con el proveedor (punto 7) ==========================
   Reglas confirmadas con el usuario (ver el punto 7 en Accesorios_Incamotors.md):
   - El tramo lo dispara el TOTAL BRUTO de la cotización (no el subtotal de cada artículo).
   - El % del tramo es un TOPE: el vendedor aplica lo que quiera entre 0 y ese tope.
   - El descuento lo comparten proveedor e Incamotors, según el % que asume CADA proveedor.
   - `total` guarda el NETO (lo que paga el cliente); el bruto y el descuento van aparte. Así
     facturación, metas, comisiones y el PDF siguen leyendo `total` sin cambios.                    */
// OJO: dos funciones a propósito. La lista GUARDADA conserva su orden de carga (`tramosDescuentoRaw`)
// y es la que indexan la tabla de Mantenimientos y sus editores — si se editara sobre la versión
// ordenada, cambiar un "desde" reordenaría la lista y el índice pasaría a apuntar a otro tramo,
// pisando el equivocado (bug detectado al probar). El orden solo se aplica para EVALUAR el tramo.
function tramosDescuentoRaw(){
  if(!Array.isArray(maestro.tramos_descuento)) maestro.tramos_descuento = [];
  return maestro.tramos_descuento;
}
function tramosDescuento(){
  return tramosDescuentoRaw().slice().sort((a,b)=> Number(a.desde)-Number(b.desde));
}
// Tramo más alto que alcanza ese monto bruto; null si no llega a ninguno.
function tramoAplicable(bruto){
  let elegido = null;
  tramosDescuento().forEach(t=>{ if((Number(bruto)||0) >= Number(t.desde)) elegido = t; });
  return elegido;
}
function topeDescuentoPct(bruto){
  const t = tramoAplicable(bruto);
  return t ? Number(t.pctMax)||0 : 0;
}
function pctAsumeProveedor(codigoProveedor){
  const p = (maestro.proveedores||[]).find(x=>x.codigo===codigoProveedor);
  return p ? (Number(p.pct_asume_descuento)||0) : 0;
}
function nombreProveedor(codigoProveedor){
  const p = (maestro.proveedores||[]).find(x=>x.codigo===codigoProveedor);
  return p ? p.nombre : codigoProveedor;
}
// Proveedor de un artículo en una sede. Si hay varios registros Proveedor+Sede, gana el de MENOR costo
// (mismo criterio que kitCostoMinSede usa para valorizar un Kit). null si el artículo no existe o no
// tiene ningún proveedor cargado en esa sede — ese caso NO se descarta en silencio: el reporte lo
// muestra como "sin proveedor", porque es plata que alguien tiene que asumir.
function proveedorDeArticuloEnSede(codigoArticulo, sede){
  const art = (catalogo.articulos||{})[codigoArticulo];
  if(!art) return null;
  const filas = (art.proveedores||[]).filter(f=>f.sede===sede && f.proveedor_codigo);
  if(!filas.length) return null;
  let mejor = null;
  filas.forEach(f=>{
    const costoSoles = (f.moneda_costo==='USD') ? (Number(f.costo)||0)*tcGlobalDolaresASoles() : (Number(f.costo)||0);
    if(mejor===null || costoSoles < mejor.costoSoles) mejor = { proveedor_codigo:f.proveedor_codigo, costoSoles };
  });
  return mejor ? mejor.proveedor_codigo : null;
}
function precioArticuloEnSede(codigoArticulo, sede, moneda){
  const art = (catalogo.articulos||{})[codigoArticulo];
  if(!art) return 0;
  const p = (art.precios_por_sede||{})[sede] || {};
  return Number(moneda==='USD' ? p.precio_venta_usd : p.precio_venta_pen) || 0;
}
// Aplana una cotización a "unidades de artículo real" con su peso económico, ABRIENDO LOS KITS en sus
// componentes (decisión del usuario): así el descuento de una línea de Kit se reparte entre los
// proveedores de los artículos que lo componen, en vez de quedar sin atribuir.
function lineasAtribuiblesDescuento(c){
  const out = [];
  (c.items||[]).forEach(it=>{
    if(it.es_kit && Array.isArray(it.componentes_snapshot) && it.componentes_snapshot.length){
      // Peso de cada componente según su precio ACTUAL en la sede de la cotización. Si el catálogo
      // cambió desde que se cotizó, es una aproximación — es el único dato disponible, el snapshot
      // del Kit solo guarda código y cantidad, no precio.
      const comps = it.componentes_snapshot.map(cs=>({
        codigo_articulo: cs.codigo_articulo,
        nombre: cs.nombre_largo||cs.nombre_corto||cs.codigo_articulo,
        peso: precioArticuloEnSede(cs.codigo_articulo, c.sede, c.moneda) * (Number(cs.cantidad)||0) * (Number(it.cantidad)||0)
      }));
      const sumaPesos = comps.reduce((s,x)=>s+x.peso,0);
      if(sumaPesos > 0){
        comps.forEach(x=> out.push({ codigo_articulo:x.codigo_articulo, nombre:x.nombre, desdeKit:it.codigo_articulo,
                                     peso: (x.peso/sumaPesos) * (Number(it.subtotal)||0) }));
      } else {
        // Ningún componente tiene precio en esta sede (o ya no están en el catálogo): la línea entera
        // queda sin proveedor identificable, pero no se pierde.
        out.push({ codigo_articulo:null, nombre:(it.nombre_largo||it.nombre_corto||it.codigo_articulo), desdeKit:it.codigo_articulo, peso:Number(it.subtotal)||0 });
      }
    } else {
      out.push({ codigo_articulo:it.codigo_articulo, nombre:(it.nombre_largo||it.nombre_corto||it.codigo_articulo), desdeKit:null, peso:Number(it.subtotal)||0 });
    }
  });
  return out;
}
const SIN_PROVEEDOR = '__sin_proveedor__';
// Reparte el descuento de una cotización entre sus proveedores. Devuelve, por proveedor, cuánto asume
// él y cuánto queda para Incamotors. Todo en la MONEDA DE LA COTIZACIÓN (el reporte lo pasa a soles).
function repartoDescuentoCotizacion(c){
  const descuento = Number(c.descuento_monto)||0;
  const lineas = lineasAtribuiblesDescuento(c);
  const sumaPesos = lineas.reduce((s,l)=>s+l.peso,0);
  const porProveedor = {};
  if(descuento <= 0 || sumaPesos <= 0) return porProveedor;
  lineas.forEach(l=>{
    const parte = descuento * (l.peso/sumaPesos);
    const prov = l.codigo_articulo ? proveedorDeArticuloEnSede(l.codigo_articulo, c.sede) : null;
    const clave = prov || SIN_PROVEEDOR;
    const pct = prov ? pctAsumeProveedor(prov) : 0;
    if(!porProveedor[clave]) porProveedor[clave] = { proveedor:clave, descuentoAtribuido:0, asumeProveedor:0, asumeIncamotors:0 };
    porProveedor[clave].descuentoAtribuido += parte;
    porProveedor[clave].asumeProveedor    += parte * (pct/100);
    porProveedor[clave].asumeIncamotors   += parte * (1 - pct/100);
  });
  return porProveedor;
}

// Desglose del descuento dentro del detalle de una cotización: quién asume qué.
function bloqueRepartoDescuento(c, simbolo){
  const reparto = repartoDescuentoCotizacion(c);
  const filas = Object.values(reparto);
  if(!filas.length) return '';
  const totProv = filas.reduce((s,r)=>s+r.asumeProveedor,0);
  const totInca = filas.reduce((s,r)=>s+r.asumeIncamotors,0);
  return `
    <div class="card" style="margin-top:14px">
      <h2>Reparto del descuento</h2>
      <p class="sub">Cuánto de este descuento asume cada proveedor y cuánto queda a cargo de Incamotors. El descuento se prorratea entre los artículos según su peso en la venta; los Kits se abren en sus componentes.</p>
      <table>
        <thead><tr><th>Proveedor</th><th style="text-align:right">% que asume</th><th style="text-align:right">Descuento atribuido</th><th style="text-align:right">Asume proveedor</th><th style="text-align:right">Asume Incamotors</th></tr></thead>
        <tbody>${filas.map(r=>`<tr>

let descuentosFiltros = { anio:new Date().getFullYear(), mes:new Date().getMonth()+1, sede:[], proveedor:[] };
// Todas las cotizaciones con descuento aplicado, ya repartidas por proveedor y convertidas a soles.
function filasDescuentosPorProveedor(){
  const f = descuentosFiltros;
  const out = [];
  Object.values(cotizaciones.registros).forEach(c=>{
    if(!(Number(c.descuento_monto)>0)) return;
    if(c.estado==='Reemplazada') return; // una cotización reemplazada no genera pago a nadie
    const d = new Date(c.fecha_registro);
    if(f.anio && d.getFullYear()!==f.anio) return;
    if(f.mes && (d.getMonth()+1)!==f.mes) return;
    if(!msFiltraArray(f.sede, c.sede)) return;
    Object.values(repartoDescuentoCotizacion(c)).forEach(r=>{
      if(!msFiltraArray(f.proveedor, r.proveedor)) return;
      out.push({ cotizacion:c, proveedor:r.proveedor,
                 descuentoAtribuido: aSoles(r.descuentoAtribuido, c.moneda),
                 asumeProveedor: aSoles(r.asumeProveedor, c.moneda),
                 asumeIncamotors: aSoles(r.asumeIncamotors, c.moneda) });
    });
  });
  return out.sort((a,b)=> new Date(b.cotizacion.fecha_registro)-new Date(a.cotizacion.fecha_registro));
}

/* ==== Metas (punto 5) y Comisiones (punto 6) de "Pendientes solicitados" ====================
   Dos reportes separados a propósito (el usuario lo pidió así: "ese 5% es para otro reporte"):
   - Metas: avance mensual de cada vendedor contra su meta en S/, medido sobre lo REALMENTE FACTURADO.
   - Comisiones: 5% (configurable) del valor sin IGV, solo de cotizaciones facturadas al 100%.
   Ambos convierten las cotizaciones en US$ a soles con el tipo de cambio Dólares→Soles del maestro,
   porque las metas y la comisión se expresan siempre en soles. */

function aSoles(monto, moneda){
  return (Number(monto)||0) * (moneda==='USD' ? tcGlobalDolaresASoles() : 1);
}
// Quién "vende" a efectos de metas y comisiones: la cuenta que registró la cotización.
function nombreAsesor(c){ return c.usuario_nombre || c.usuario_codigo || '—'; }
// Solo las cuentas que pueden registrar cotizaciones (el rol facturador no cotiza — ver gruposVisibles).
function usuariosVendedores(){
  return (maestro.usuarios||[]).filter(u=>u.rol!=='facturador');
}
// Toda factura emitida, aplanada, con su cotización de origen y su monto ya convertido a soles.
// Se imputa al mes de la FECHA DE LA FACTURA, no al de la cotización: una venta de agosto cuyo
// anticipo se factura en septiembre suma a la meta de septiembre (es una meta sobre facturación).
function facturasEmitidas(){
  const out = [];
  Object.values(cotizaciones.registros).forEach(c=>{
    facturasDe(c).forEach(f=>{
      if(!f.fecha) return;
      const d = new Date(f.fecha+'T00:00:00');
      if(isNaN(d)) return;
      out.push({ cotizacion:c, factura:f, anio:d.getFullYear(), mes:d.getMonth()+1,
                 montoSoles: aSoles(f.monto, c.moneda) });
    });
  });
  return out;
}
function pctComisionAsesor(){
  const v = Number(maestro.pct_comision_asesor);
  return isNaN(v) ? 5 : v;
}
// Una cotización es comisionable cuando quedó facturada al 100%. Se imputa al mes de la factura que
// la completó (la última por fecha) — es cuando la comisión queda devengada.
function cotizacionesComisionables(){
  const out = [];
  Object.values(cotizaciones.registros).forEach(c=>{
    const fs = facturasDe(c);
    if(!fs.length || !facturaCompleta(c)) return;
    const fechas = fs.map(f=>f.fecha).filter(Boolean).sort();
    if(!fechas.length) return;
    const d = new Date(fechas[fechas.length-1]+'T00:00:00');
    if(isNaN(d)) return;
    const totalSoles = aSoles(c.total, c.moneda);
    const opGravada = totalSoles/(1+IGV_TASA);
    out.push({ cotizacion:c, anio:d.getFullYear(), mes:d.getMonth()+1, fechaCierre:fechas[fechas.length-1],
               totalSoles, opGravada, comision: opGravada * (pctComisionAsesor()/100) });
  });
  return out;
}

// "Ventas / Mis Ventas", punto 2).

  const facturadoPorUsuario = {};
  facturasEmitidas().forEach(f=>{
    if(f.anio!==anio || f.mes!==mes) return;
    const cod = f.cotizacion.usuario_codigo;
    facturadoPorUsuario[cod] = (facturadoPorUsuario[cod]||0) + f.montoSoles;
  });
  const filas = usuariosVendedores()
    .filter(u=>alcanceVendedor(u.codigo))
    .map(u=>{
      const meta = metas[claveMeta(u.codigo, anio, mes)];
      const montoMeta = meta ? Number(meta.monto_meta_soles)||0 : 0;
      const facturado = facturadoPorUsuario[u.codigo]||0;
      return { usuario:u, montoMeta, facturado, falta: Math.max(0, montoMeta-facturado),
               pct: montoMeta>0 ? (facturado/montoMeta)*100 : null };
    })
    .filter(f=> f.montoMeta>0 || f.facturado>0)
    .sort((a,b)=> b.facturado-a.facturado);
  const totMeta = filas.reduce((s,f)=>s+f.montoMeta,0);
  const totFact = filas.reduce((s,f)=>s+f.facturado,0);
  const cumplen = filas.filter(f=>f.pct!==null && f.pct>=100).length;
  const conMeta = filas.filter(f=>f.montoMeta>0).length;
  document.getElementById('mt-kpis').innerHTML = `
    <div class="card" style="margin:0"><p class="eyebrow">Meta total</p><div class="kpi-pct">S/ ${totMeta.toFixed(2)}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Facturado</p><div class="kpi-pct">S/ ${totFact.toFixed(2)}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Cumplimiento global</p><div class="kpi-pct">${totMeta>0?((totFact/totMeta)*100).toFixed(1)+'%':'—'}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Vendedores que cumplen</p><div class="kpi-pct">${cumplen} / ${conMeta}</div></div>`;
  const tbody = document.getElementById('mt-tbody');
  if(!filas.length){ tbody.innerHTML = `<tr><td colspan="5" class="empty">Sin metas cargadas ni facturación en ${mes}/${anio}.</td></tr>`; return; }
  tbody.innerHTML = filas.map(f=>{
    const pct = f.pct;
    const barra = pct===null ? '<span class="sub" style="margin:0">Sin meta cargada</span>' : `
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:90px;height:6px;background:var(--silver-soft);border:1px solid var(--silver-line);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.min(100,pct).toFixed(1)}%;background:${pct>=100?'var(--ok)':'var(--gold)'}"></div>
        </div>
        <span style="white-space:nowrap;font-weight:600;color:${pct>=100?'var(--ok)':'var(--ink)'}">${pct.toFixed(1)}%</span>
      </div>`;
    return `<tr>
      <td><strong>${f.usuario.nombre}</strong><div class="sub" style="margin:0">${f.usuario.codigo}</div></td>
      <td style="text-align:right">${f.montoMeta>0?f.montoMeta.toFixed(2):'—'}</td>
      <td style="text-align:right">${f.facturado.toFixed(2)}</td>
      <td style="text-align:right">${f.montoMeta>0?f.falta.toFixed(2):'—'}</td>
      <td>${barra}</td>
    </tr>`;
  }).join('');
}

function comisionesFiltradas(){
  const f = comisionesFiltros;
  return cotizacionesComisionables().filter(r=>{
    const c = r.cotizacion;
    if(!alcanceVendedor(c.usuario_codigo)) return false;
    if(f.anio && r.anio!==f.anio) return false;
    if(f.mes && r.mes!==f.mes) return false;
    if(!msFiltraArray(f.sede, c.sede)) return false;
    if(!msFiltraArray(f.marca, (c.vehiculo||{}).marca)) return false;
    if(!msFiltraArray(f.vendedor, (c.vendedor||{}).dni)) return false;
    if(!msFiltraArray(f.asesor, c.usuario_codigo)) return false;
    return true;
  }).sort((a,b)=> (a.fechaCierre<b.fechaCierre?1:-1));
}
function renderComisionesTabla(){
  const filas = comisionesFiltradas();
  const agrupador = COMISION_AGRUPADORES[comisionesFiltros.agruparPor];
  const totTotal = filas.reduce((s,r)=>s+r.totalSoles,0);
  const totGravada = filas.reduce((s,r)=>s+r.opGravada,0);
  const totComision = filas.reduce((s,r)=>s+r.comision,0);
  document.getElementById('cm-kpis').innerHTML = `
    <div class="card" style="margin:0"><p class="eyebrow">Ventas cerradas</p><div class="kpi-pct">${filas.length}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Total facturado</p><div class="kpi-pct">S/ ${totTotal.toFixed(2)}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Op. gravada</p><div class="kpi-pct">S/ ${totGravada.toFixed(2)}</div></div>
    <div class="card" style="margin:0"><p class="eyebrow">Comisión ${pctComisionAsesor()}%</p><div class="kpi-pct">S/ ${totComision.toFixed(2)}</div></div>`;
  document.getElementById('cm-titulo-grupo').textContent = 'Resumen por '+agrupador.label;
  document.getElementById('cm-th-grupo').textContent = agrupador.label;
  const grupos = {};
  filas.forEach(r=>{
    const k = agrupador.valor(r);
    if(!grupos[k]) grupos[k] = { n:0, total:0, gravada:0, comision:0 };
    grupos[k].n++; grupos[k].total+=r.totalSoles; grupos[k].gravada+=r.opGravada; grupos[k].comision+=r.comision;
  });
  const tbody = document.getElementById('cm-tbody');
  const orden = Object.entries(grupos).sort((a,b)=> b[1].comision-a[1].comision);
  tbody.innerHTML = orden.length ? orden.map(([k,g])=>`<tr>
      <td><strong>${k}</strong></td>
      <td style="text-align:right">${g.n}</td>
      <td style="text-align:right">${g.total.toFixed(2)}</td>
      <td style="text-align:right">${g.gravada.toFixed(2)}</td>
      <td style="text-align:right;font-weight:700">${g.comision.toFixed(2)}</td>
    </tr>`).join('') + `<tr style="border-top:2px solid var(--silver-line)">
      <td><strong>Total</strong></td><td style="text-align:right"><strong>${filas.length}</strong></td>
      <td style="text-align:right"><strong>${totTotal.toFixed(2)}</strong></td>
      <td style="text-align:right"><strong>${totGravada.toFixed(2)}</strong></td>
      <td style="text-align:right"><strong>${totComision.toFixed(2)}</strong></td></tr>`
    : `<tr><td colspan="5" class="empty">Sin cotizaciones facturadas al 100% que coincidan con los filtros.</td></tr>`;
  const det = document.getElementById('cm-detalle');
  det.innerHTML = filas.length ? filas.map(r=>{
    const c = r.cotizacion;
    return `<tr>
      <td><span class="cod">${c.codigo}</span></td>
      <td>${new Date(r.fechaCierre+'T00:00:00').toLocaleDateString('es-PE')}</td>
      <td>${c.sede}</td>
      <td>${(c.vehiculo||{}).marca||'-'}</td>
      <td>${c.cliente.nombre}</td>
      <td>${(c.vendedor||{}).nombre||'-'}</td>
      <td>${nombreAsesor(c)}</td>
      <td style="text-align:right">${r.totalSoles.toFixed(2)}</td>
      <td style="text-align:right">${r.opGravada.toFixed(2)}</td>
      <td style="text-align:right;font-weight:700">${r.comision.toFixed(2)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="10" class="empty">Sin detalle para mostrar.</td></tr>`;
}
function exportarComisionesCSV(){
  const filas = comisionesFiltradas();
  if(!filas.length){ alert('No hay ventas cerradas que coincidan con los filtros actuales.'); return; }
  const encabezados = ['Código','Fecha de cierre','Sede','Marca','Modelo','VIN/Placa','Cliente','Documento cliente','Vendedor asignado','Asesor','Moneda original','Total original','Total S/','Op. gravada S/',`Comisión ${pctComisionAsesor()}% S/`];
  const datos = filas.map(r=>{
    const c = r.cotizacion;
    return [ c.codigo, new Date(r.fechaCierre+'T00:00:00').toLocaleDateString('es-PE'), c.sede,
      (c.vehiculo||{}).marca||'', (c.vehiculo||{}).modelo||'', (c.vehiculo||{}).vin||'',
      c.cliente.nombre, c.cliente.documento||'', (c.vendedor||{}).nombre||'', nombreAsesor(c),
      nombreMoneda(c.moneda), (Number(c.total)||0).toFixed(2),
      r.totalSoles.toFixed(2), r.opGravada.toFixed(2), r.comision.toFixed(2) ];
  });
  descargarCSV(`comisiones_${new Date().toISOString().slice(0,10)}.csv`, encabezados, datos);
}

function columnasPlantillaVendedores(){
  return ['DNI','TIPO DOC','NOMBRE','SEDES','ESTADO'];
}
function descargarPlantillaVendedores(){
  const encabezados = columnasPlantillaVendedores();
  const contenido = encabezados.join('\t') + '\n';
  const blob = new Blob([contenido], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'plantilla_vendedores.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
let vendedoresImportPreview = [];
function analizarImportacionVendedores(){
  const texto = document.getElementById('vd-import-textarea').value;
  const lineas = texto.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim().length>0);
  const resultado = document.getElementById('vd-import-resultado');
  if(lineas.length<2){ resultado.innerHTML = '<p class="msg err">Pega los datos con encabezado y al menos una fila.</p>'; return; }
  const sedesValidas = maestro.sedes||[];
  const dniVistos = new Set((maestro.vendedores||[]).map(v=>v.dni));
  const validas = []; const errores = [];
  lineas.slice(1).forEach((linea, idx)=>{
    const c = linea.split('\t');
    const numFila = idx+2;
    const dni = (c[0]||'').trim();
    const tipoDoc = (c[1]||'').trim().toUpperCase();
    const nombre = (c[2]||'').trim();
    const sedesStr = (c[3]||'').trim();
    const estadoStr = (c[4]||'').trim();
    if(!dni){ errores.push(`Fila ${numFila}: falta el documento.`); return; }
    if(!nombre){ errores.push(`Fila ${numFila}: falta el nombre.`); return; }
    if(!['DNI','CE'].includes(tipoDoc)){ errores.push(`Fila ${numFila}: tipo de documento "${tipoDoc}" inválido (debe ser DNI o CE).`); return; }
    if(dniVistos.has(dni)){ errores.push(`Fila ${numFila}: ya existe un vendedor con el documento "${dni}" (o está repetido en esta lista).`); return; }
    const sedes = sedesStr.split(',').map(x=>x.trim()).filter(Boolean);
    const sedesInvalidas = sedes.filter(s=>!sedesValidas.includes(s));
    if(sedesInvalidas.length){ errores.push(`Fila ${numFila}: sede(s) inválida(s): ${sedesInvalidas.join(', ')}.`); return; }
    let estado = 'Habilitado';
    if(estadoStr!==''){
      if(!['Habilitado','Deshabilitado'].includes(estadoStr)){ errores.push(`Fila ${numFila}: estado "${estadoStr}" inválido (debe ser Habilitado o Deshabilitado).`); return; }
      estado = estadoStr;
    }
    dniVistos.add(dni);
    validas.push({ dni, tipo_documento:tipoDoc, nombre, sedes, estado });
  });
  vendedoresImportPreview = validas;
  resultado.innerHTML = `
    <p class="msg ${validas.length?'ok':'err'}">${validas.length} vendedor(es) listo(s) para crear.</p>
    ${errores.length?`<p class="msg err">${errores.length} fila(s) con problemas:</p><ul style="font-size:12px;color:var(--danger)">${errores.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}
    ${validas.length?`<button class="btn btn-amber" onclick="ejecutarImportacionVendedores()">Confirmar y crear ${validas.length} vendedor(es)</button>`:''}
  `;
}
async function ejecutarImportacionVendedores(){
  const n = vendedoresImportPreview.length;
  if(!maestro.vendedores) maestro.vendedores=[];
  vendedoresImportPreview.forEach(v=>{
    maestro.vendedores.push({ dni:v.dni, tipo_documento:v.tipo_documento, nombre:v.nombre, sedes:v.sedes, estado:v.estado });
  });
  await guardarMaestro();
  vendedoresImportPreview = [];
  document.getElementById('vd-import-textarea').value = '';
  document.getElementById('vd-import-resultado').innerHTML = `<p class="msg ok">${n} vendedor(es) creado(s) correctamente.</p>`;
  renderVendedoresTabla();
}
// Insignia de la columna "Última edición" (columna `origen`). Ver el comentario de guardarMaestro():
// dice quién escribió la fila por última vez, no de dónde nació el vendedor.
function badgeOrigenVendedor(v){

  return v.origen==='dms'
    ? `<span class="badge b-info">DMS</span>${cuando?` <span class="sub" style="margin:0">${cuando}</span>`:''}`
    : `<span class="badge b-abierto">Manual</span>${cuando?` <span class="sub" style="margin:0">${cuando}</span>`:''}`;
}
function renderVendedoresTabla(){

  let items = maestro.vendedores||[];

  }
  tbody.innerHTML = items.length ? items.map(v=>`<tr>
    <td>
      <select onchange="editarVendedorCampo('${escJs(v.dni)}','tipo_documento',this.value)">
        <option value="DNI" ${(v.tipo_documento||'DNI')==='DNI'?'selected':''}>DNI</option>
        <option value="CE" ${v.tipo_documento==='CE'?'selected':''}>CE</option>
      </select>
    </td>
    <td><input value="${escAttr(v.dni)}" style="width:100%;min-width:90px" onblur="editarVendedorCampo('${escJs(v.dni)}','dni',this.value)"></td>
    <td><input value="${escAttr(v.nombre)}" style="width:100%;min-width:180px" onblur="editarVendedorCampo('${escJs(v.dni)}','nombre',this.value)"></td>
    <td><input value="${escAttr(v.telefono||'')}" style="width:100%;min-width:110px" onblur="editarVendedorCampo('${escJs(v.dni)}','telefono',this.value)"></td>
    <td>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${(maestro.sedes||[]).map(s=>`<label class="check-row"><input type="checkbox" value="${escAttr(s)}" ${(v.sedes||[]).includes(s)?'checked':''} onchange="toggleSedeVendedor('${escJs(v.dni)}','${escJs(s)}',this.checked)"> ${s}</label>`).join('') || '<span class="sub">Sin sedes configuradas.</span>'}
      </div>
    </td>
    <td>
      <select onchange="cambiarEstadoVendedor('${escJs(v.dni)}',this.value)">
        <option value="Habilitado" ${v.estado==='Habilitado'?'selected':''}>Habilitado</option>
        <option value="Deshabilitado" ${v.estado==='Deshabilitado'?'selected':''}>Deshabilitado</option>
      </select>
    </td>
    <td>${badgeOrigenVendedor(v)}</td>
    <td><span style="cursor:pointer;color:var(--danger);font-weight:700" onclick="quitarVendedor('${escJs(v.dni)}')">Quitar</span></td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">Sin vendedores aún.</td></tr>`;
}
async function editarVendedorCampo(dniOriginal, campo, valor){
  const v = maestro.vendedores.find(x=>x.dni===dniOriginal);
  if(!v) return;
  if(campo==='dni'){
    valor = valor.trim();
    if(!valor){ alert('El documento no puede quedar vacío.'); renderVendedoresTabla(); return; }
    if(valor!==dniOriginal && maestro.vendedores.some(x=>x.dni===valor)){ alert('Ya existe un vendedor con ese documento.'); renderVendedoresTabla(); return; }
    v.dni = valor;
  } else if(campo==='nombre'){
    valor = valor.trim();
    if(!valor){ alert('El nombre no puede quedar vacío.'); renderVendedoresTabla(); return; }
    v.nombre = valor;
  } else if(campo==='tipo_documento'){
    v.tipo_documento = valor;
  } else if(campo==='telefono'){
    v.telefono = valor.trim() || null;
  }
  await guardarMaestro();
  renderVendedoresTabla();
}
async function agregarVendedor(){
  const dni = document.getElementById('vd-dni').value.trim();
  const nombre = document.getElementById('vd-nombre').value.trim();
  if(!dni || !nombre){ alert('El documento y el nombre son obligatorios.'); return; }
  if(!maestro.vendedores) maestro.vendedores=[];
  if(maestro.vendedores.some(v=>v.dni===dni)){ alert('Ya existe un vendedor con ese documento.'); return; }
  const tipo_documento = document.getElementById('vd-tipodoc').value;
  const sedes = [...document.querySelectorAll('#vd-nuevo-sedes input:checked')].map(c=>c.value);
  maestro.vendedores.push({ dni, tipo_documento, nombre, sedes, estado:'Habilitado' });
  await guardarMaestro();
  document.getElementById('vd-dni').value='';
  document.getElementById('vd-nombre').value='';
  renderMantVendedores();
}
async function toggleSedeVendedor(dni, sede, marcado){
  const v = maestro.vendedores.find(x=>x.dni===dni);
  if(!v) return;
  if(!v.sedes) v.sedes=[];
  if(marcado){ if(!v.sedes.includes(sede)) v.sedes.push(sede); }
  else{ v.sedes = v.sedes.filter(s=>s!==sede); }
  await guardarMaestro();
}
async function cambiarEstadoVendedor(dni, estado){
  const v = maestro.vendedores.find(x=>x.dni===dni);
  if(!v) return;
  v.estado = estado;
  await guardarMaestro();
}
async function quitarVendedor(dni){
  if(!confirm('¿Eliminar este vendedor?')) return;
  maestro.vendedores = maestro.vendedores.filter(v=>v.dni!==dni);
  await guardarMaestro();
  renderVendedoresTabla();
}
/* ---- Sincronización de vendedores con el DMS (Edge Function `sync-vendedores-dms`) ----
   Patrón de dos llamadas a la MISMA función: {} devuelve una vista previa de solo lectura y
   {confirmar:true} aplica. Va por botón y nunca por cron, porque pisa trabajo cargado a mano y
   borra filas — la regla es: si una sync solo agrega historia puede ir automática; si pisa o borra
   trabajo humano, va por botón con vista previa. */
function listaNombres_(nombres, tope){
  const n = nombres || [];
  if(!n.length) return '';
  const muestra = n.slice(0, tope||12).join(', ');
  return muestra + (n.length > (tope||12) ? ` … y ${n.length-(tope||12)} más` : '');
}

async function editarSedeDms(i, campo, valor){
  const filas = sedesDmsRaw();

  await guardarMaestro();
  renderSedesDms(document.getElementById('mg-sedes-dms'));

  renderSedesDms(document.getElementById('mg-sedes-dms'));

async function quitarSedeDms(i){
  const filas = sedesDmsRaw();

  if(!confirm(`¿Quitar la traducción "${filas[i].dms}" → "${filas[i].sede}"? Esa sede dejará de sincronizarse.`)) return;
  filas.splice(i,1);

  renderSedesDms(document.getElementById('mg-sedes-dms'));
}

/* Usuarios vive en la tabla 'usuarios' de Supabase, vinculada 1 a 1 con una identidad de Supabase
   Auth (auth_user_id) — por eso crear/eliminar un usuario, o cambiarle la contraseña, no puede ser un
   simple update/delete a la tabla (dejaría una identidad de Auth huérfana, o ninguna identidad para
   un alta nueva): esas 3 acciones pasan por la Edge Function 'manage-usuarios' (corre con la
   service_role key, nunca expuesta acá). Editar nombre/documento/rol/sedes de un usuario YA
   existente sí es un update directo — no toca su identidad de Auth. */
async function llamarEdgeFunction_(nombre, body){
  const { data: { session } } = await sb.auth.getSession();
  if(!session) throw new Error('Tu sesión expiró — vuelve a iniciar sesión.');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${nombre}`, {
    method:'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token},
    body: JSON.stringify(body)
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'Error de conexión con el servidor.');
  return j.data;
}
async function guardarUsuarioEnSheet_(u){
  const { error } = await sb.from('usuarios').update({
    nombre: u.nombre, documento: u.documento||null, tipo_documento: u.tipo_documento, sedes: u.sedes||[], rol: u.rol
  }).eq('codigo', u.codigo);
  if(error) throw error;
}
async function editarUsuarioCampo(codigo, campo, valor){
  const u = maestro.usuarios.find(x=>x.codigo===codigo);
  if(!u) return;
  if(campo==='nombre'){
    valor = valor.trim();
    if(!valor){ alert('El nombre no puede quedar vacío.'); renderUsuariosTabla(); return; }
    u.nombre = valor;
  } else if(campo==='documento'){
    u.documento = valor.trim();
  } else if(campo==='tipo_documento'){
    u.tipo_documento = valor;
  } else if(campo==='rol'){
    u.rol = valor;
  }
  await guardarUsuarioEnSheet_(u);
}
async function toggleSedeUsuario(codigo, sede, marcado){
  const u = maestro.usuarios.find(x=>x.codigo===codigo);
  if(!u) return;
  if(!u.sedes) u.sedes=[];
  if(marcado){ if(!u.sedes.includes(sede)) u.sedes.push(sede); }
  else{ u.sedes = u.sedes.filter(s=>s!==sede); }
  await guardarUsuarioEnSheet_(u);
}
async function cambiarPasswordUsuario(codigo){
  const nueva = prompt('Nueva contraseña para "'+codigo+'" (mínimo 6 caracteres):');
  if(nueva===null) return;
  if(nueva.trim().length<6){ alert('La contraseña debe tener al menos 6 caracteres.'); return; }
  try{
    await llamarEdgeFunction_('manage-usuarios', {action:'setPassword', codigo, newPassword: nueva.trim()});
    alert('Contraseña actualizada.');
  }catch(e){
    alert('No se pudo cambiar la contraseña: '+e.message);
  }
}
async function agregarUsuario(){
  const codigo = document.getElementById('us-codigo').value.trim();
  const nombre = document.getElementById('us-nombre').value.trim();
  const password = document.getElementById('us-pin').value.trim();
  if(!codigo || !nombre){ alert('Código y nombre son obligatorios.'); return; }
  if(!password || password.length<6){ alert('La contraseña es obligatoria y debe tener al menos 6 caracteres.'); return; }
  if((maestro.usuarios||[]).some(u=>u.codigo===codigo)){ alert('Ya existe un usuario con ese código.'); return; }
  const sedes = [...document.querySelectorAll('#us-nuevo-sedes input:checked')].map(c=>c.value);
  const tipo_documento = 'DNI', documento = document.getElementById('us-documento').value.trim(), rol = document.getElementById('us-rol').value;
  // No es optimista a propósito: la creación real puede fallar (código repetido, contraseña débil) y
  // recién existe un usuario de verdad cuando la Edge Function terminó bien.
  try{
    const fila = await llamarEdgeFunction_('manage-usuarios', {action:'create', codigo, nombre, documento, tipo_documento, sedes, rol, password});
    maestro.usuarios.push(fila);
    renderMantUsuarios();
  }catch(e){
    alert('No se pudo crear el usuario: '+e.message);
  }
}
async function quitarUsuario(codigo){
  if(codigo===currentUser.codigo){ alert('No puedes eliminar tu propio usuario mientras tienes la sesión abierta.'); return; }
  if(!confirm('¿Eliminar este usuario?')) return;
  try{
    await llamarEdgeFunction_('manage-usuarios', {action:'delete', codigo});
    maestro.usuarios = maestro.usuarios.filter(u=>u.codigo!==codigo);
    renderMantUsuarios();
  }catch(e){
    alert('No se pudo eliminar el usuario: '+e.message);
  }
}

async function aprobarSolicitudCodigo(codigo){
  const sol = solicitudesArticulo[codigo];
  if(sol && sol.propagacion_pendiente_codigo){
    // El artículo ya se había creado en un intento anterior que falló al propagar (ver
    // guardarArticuloForm) — reintenta SOLO la propagación, sin volver a crear el artículo.
    const msg = document.getElementById('ms-tbody');
    try{
      await propagarAprobacionSolicitud_(codigo, sol.propagacion_pendiente_codigo);
      sol.estado = 'Aprobada';
      sol.codigo_articulo_final = sol.propagacion_pendiente_codigo;
      sol.aprobado_por = currentUser.codigo;
      sol.aprobado_en = new Date().toISOString();
      delete sol.propagacion_pendiente_codigo;
      await guardarSolicitudArticuloEnArchivo(codigo);
      renderSidebar();
      renderMantSolicitudesTabla();
    }catch(e){
      alert('Sigue sin poder completarse: '+e.message+'. El artículo '+sol.propagacion_pendiente_codigo+' ya existe en el catálogo — intenta de nuevo más tarde.');
    }
    return;
  }
  aprobandoSolicitudCodigo = codigo;
  editingArticuloCodigo = null;
  switchView('articulo-form');
}
async function rechazarSolicitudCodigo(codigo){
  const s = solicitudesArticulo[codigo];
  if(!s) return;
  const motivo = prompt('Motivo del rechazo (opcional):', '');
  if(motivo===null) return; // canceló el prompt
  s.estado = 'Rechazada';
  s.motivo_rechazo = motivo || '';
  await guardarSolicitudArticuloEnArchivo(codigo);
  renderSidebar();
  renderMantSolicitudesTabla();
}

/* ---- Backup: Exportar / Importar todo (solo administrador). El sistema vive en Supabase (Postgres),
   así que exportar/importar es solo JSON — sin ZIP ni binarios: las facturas/vouchers ya cargados quedan
   en Supabase Storage (bucket 'cotizaciones-adjuntos') con su propia referencia (storagePath/url) dentro
   de cada cotización, restaurar un backup no las toca (mismo criterio que los adjuntos de Créditos en el
   sistema F&I). Tampoco restaura 'usuarios' — ver comentario de reemplazarTablaCompleta_ más abajo. ---- */
let backupPendiente = null;
function renderBackup(){
  const el = document.getElementById('view-backup');
  el.innerHTML = `
    <div class="card">
      <h2>Backup completo</h2>
      <p class="sub">Descarga un archivo .json con todo el sistema: maestro (sedes, marcas, entidades), vendedores, usuarios, artículos, kits y las cotizaciones de todos los usuarios. Es el respaldo que hay que usar para poder restaurar el sistema.</p>
      <button class="btn btn-amber" onclick="exportarBackupJson()">Descargar backup (.json)</button>
    </div>
    <div class="card">
      <h2>Importar</h2>
      <p class="sub" style="color:var(--danger)">Esto reemplaza TODOS los datos actuales (maestro, vendedores, artículos, kits y cotizaciones). Las facturas y vouchers ya cargados en Supabase Storage no se ven afectados. Los usuarios (login) tampoco se restauran — quedan los actuales.</p>
      <input type="file" id="bk-file" accept=".json">
      <div id="bk-preview" style="margin-top:10px"></div>
    </div>`;
  document.getElementById('bk-file').onchange = onSeleccionArchivoBackup;
}
async function datosBackup(){
  // version 4: se sumó `metas` (punto 5). Se mantiene opcional al importar, para que un backup
  // version 3 (sin metas) siga restaurándose sin romper — ver ejecutarImportarBackup.
  return { version:4, exportado_en:new Date().toISOString(), exportado_por:currentUser.codigo, maestro, articulos:catalogo, cotizaciones, metas };
}
function descargarBlob(blob, nombreArchivo){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportarBackupJson(){
  const data = await datosBackup();
  descargarBlob(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}), `backup_accesorios_${new Date().toISOString().slice(0,10)}.json`);
}
function previsualizarBackup(data){
  backupPendiente = data;
  const numCotizaciones = Object.keys((data.cotizaciones||{}).registros||{}).length;
  document.getElementById('bk-preview').innerHTML = `
    <p class="sub">Exportado: ${data.exportado_en||'-'} por ${data.exportado_por||'-'}</p>
    <p class="sub">Artículos: ${Object.keys((data.articulos||{}).articulos||{}).length} · Kits: ${Object.keys((data.articulos||{}).kits||{}).length} · Cotizaciones: ${numCotizaciones} · Vendedores: ${((data.maestro||{}).vendedores||[]).length} · Usuarios: ${((data.maestro||{}).usuarios||[]).length} · Metas: ${data.metas?Object.keys(data.metas).length:'no incluidas (backup anterior — las metas actuales se conservan)'}</p>
    <p class="sub" style="color:var(--gold-deep)">⚠ Las facturas y vouchers ya cargados no se ven afectados por importar este backup — solo se restauran los datos. Los usuarios (login) tampoco se restauran — quedan los actuales.</p>
    <button class="btn" id="bk-btn-restaurar" style="background:var(--danger);color:#fff">Restaurar este backup</button>
    <button class="btn btn-primary" id="bk-btn-cancelar" style="display:none;margin-left:8px" onclick="cancelarImportarBackup()">Cancelar</button>`;
  document.getElementById('bk-btn-restaurar').onclick = armarImportarBackup;
}
function onSeleccionArchivoBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ previsualizarBackup(JSON.parse(reader.result)); }
    catch(err){ document.getElementById('bk-preview').innerHTML = `<p class="msg err">Archivo inválido: ${err.message}</p>`; }
  };
  reader.readAsText(file);
}
function armarImportarBackup(){
  const btn = document.getElementById('bk-btn-restaurar');
  btn.textContent = '¿Confirmar? Se perderán los datos actuales';
  btn.onclick = ejecutarImportarBackup;
  document.getElementById('bk-btn-cancelar').style.display='inline-block';
}
function cancelarImportarBackup(){
  backupPendiente = null;
  document.getElementById('bk-file').value = '';
  document.getElementById('bk-preview').innerHTML = '';
}
/* Restaura con reemplazo TOTAL de cada tabla (borra todo lo existente + inserta lo del backup) en vez
   del guardado por delta que usa el resto de la app — es la operación correcta acá porque Backup ->
   Importar es una sola persona reemplazando TODO a propósito, no una edición concurrente de una fila
   puntual. NO restaura 'usuarios': cada fila está vinculada 1 a 1 a una identidad de Supabase Auth
   (auth_user_id) que el backup no tiene forma de recrear — restaurar usuarios reales requeriría pasar
   cada uno por la Edge Function 'manage-usuarios' (mismo gap ya documentado y aceptado en el sistema
   F&I para este mismo tipo de limitación). Los usuarios actuales quedan intactos tras importar. */
async function reemplazarTablaCompleta_(tabla, pkCol, filas){
  const { error: eDel } = await sb.from(tabla).delete().not(pkCol, 'is', null);
  if(eDel) throw eDel;
  if(filas.length){
    const { error: eIns } = await sb.from(tabla).insert(filas);
    if(eIns) throw eIns;
  }
}
async function ejecutarImportarBackup(){
  if(!backupPendiente) return;
  const btn = document.getElementById('bk-btn-restaurar');
  if(btn){ btn.disabled = true; btn.textContent = 'Restaurando…'; }
  try{
    const maestroBackup = migrarMaestro(backupPendiente.maestro || seedMaestro());
    const base = Object.assign({}, maestroBackup);
    delete base.vendedores; delete base.usuarios; delete base.id;
    const { error: eBase } = await sb.from('configuracion').update(base).eq('id', true);
    if(eBase) throw eBase;
    await reemplazarTablaCompleta_('vendedores', 'dni', maestroBackup.vendedores||[]);
    const cat = backupPendiente.articulos || {articulos:{}, kits:{}};
    await reemplazarTablaCompleta_('articulos', 'codigo', Object.values(cat.articulos||{}));
    await reemplazarTablaCompleta_('kits', 'codigo', Object.values(cat.kits||{}));
    const cotBackup = backupPendiente.cotizaciones || {registros:{}};
    await reemplazarTablaCompleta_('cotizaciones', 'codigo', Object.values(cotBackup.registros||{}));
    // `metas` es opcional: un backup version 3 (anterior al punto 5) no la trae y se deja intacta,
    // en vez de borrarla — restaurar un backup viejo no debería vaciar las metas ya cargadas.
    if(backupPendiente.metas){
      await reemplazarTablaCompleta_('metas', 'clave', Object.values(backupPendiente.metas));
    }
    await cargarMaestro();
    await cargarCatalogo();
    await cargarCotizaciones();
    await cargarMetas();
    backupPendiente = null;
    alert('Backup restaurado correctamente. Nota: los usuarios (login) NO se restauran desde el backup — quedan los actuales, ver aviso en pantalla.');
    switchView('catalogo');
  }catch(e){
    alert('No se pudo restaurar el backup: '+e.message);
    if(btn){ btn.disabled = false; btn.textContent = '¿Confirmar? Se perderán los datos actuales'; }
  }
}
</script>

</html>
